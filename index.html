const eixoR = v => (v<0?'-':'')+'R$ '+(Math.abs(v)>=1000? nf(Math.abs(v)/1000,Math.abs(v)>=10000?0:1)+' mil' : nf(Math.abs(v),0));
const pct = (v,d=0) => v==null||!isFinite(v) ? '—' : nf(v,d)+'%';
function barra(v, mx, neg){ const w=mx>0?Math.max(2,Math.min(100,Math.abs(v)/mx*100)):0; return `<div class="hbar"><i style="width:${w}%;background:${neg?'var(--danger)':'var(--accent)'}"></i></div>`; }

/* ---------- rentabilidade por carro ---------- */
function rentabVeiculo(v){
  const id=v.id; const acc=resumoFin(x=>x===id,()=>true);
  const compra=(+v.aqPreco||0)+(+v.aqCustos||0);
  const kmRod=Math.max(0,kmAtual(v)-(+v.kmInicial||0));
  const ult=[1,2,3].map(n=>resumoFin(x=>x===id,x=>x===mesMais(mesAtual(),-n)));
  const comMov=ult.filter(r=>r.rec||r.custo); const med=comMov.length? comMov.reduce((s,r)=>s+r.res,0)/comMov.length : null;
  const falta=compra-acc.res;
  const payback = !compra ? null : falta<=0 ? 0 : (med && med>0 ? falta/med : null);
  const c=contratoDoVeiculo(id); const aluguel=c?(+c.aluguel||0):0;
  const meses = v.aqData ? Math.max(1,mesesAte(v.aqData.slice(0,7),mesAtual())) : null;
  return {v,acc,compra,kmRod,custoKm:kmRod>0?acc.custo/kmRod:null,recKm:kmRod>0?acc.rec/kmRod:null,
    roi:compra?acc.res/compra*100:null,med,payback,aluguel,yieldMes:compra&&aluguel?aluguel/compra*100:null,meses,
    parado:!c && statusVeiculo(v)!=='vendido', status:statusVeiculo(v)};
}
function linhasRentab(){ return L('veiculos').filter(v=>statusVeiculo(v)!=='vendido' || resumoFin(x=>x===v.id,()=>true).rec).map(rentabVeiculo).sort((a,b)=>b.acc.res-a.acc.res); }
function vRentab(){
  const rs=linhasRentab(); if(!rs.length) return '<div class="tw"><div class="empty">Cadastre veículos para ver a rentabilidade.</div></div>';
  const ativos=rs.filter(r=>r.status!=='vendido'); const tot=rs.reduce((s,r)=>s+r.acc.res,0); const cap=ativos.reduce((s,r)=>s+r.compra,0);
  const ys=ativos.filter(r=>r.yieldMes!=null); const yMed=ys.length? ys.reduce((s,r)=>s+r.aluguel,0)/ys.reduce((s,r)=>s+r.compra,0)*100 : null;
  const parados=ativos.filter(r=>r.parado); const melhor=rs[0], pior=rs[rs.length-1];
  const mx=Math.max(1,...rs.map(r=>Math.abs(r.acc.res)));
  const pb=r=>r.payback==null?'<span class="muted">—</span>':r.payback===0?'<span class="pill p-ok">Já se pagou</span>':nf(r.payback,0)+' mês(es)';
  return `<div class="stack"><div class="kpis">${kpi('Resultado acumulado da frota',`<em class="${tot<0?'neg':''}">${money(tot)}</em>`,'receita menos custos, desde o início')}${kpi('Capital na frota',money(cap),'compra + preparação dos carros ativos')}${kpi('Aluguel ÷ preço do carro',pct(yMed,2),'por mês, média dos carros alugados')}${kpi('Melhor carro',esc(PL(melhor.v.id)),money(melhor.acc.res))}${rs.length>1?kpi('Pior carro',esc(PL(pior.v.id)),`<em class="${pior.acc.res<0?'neg':''}">${money(pior.acc.res)}</em>`):''}${kpi('Carros sem contrato',parados.length,parados.length?parados.map(r=>PL(r.v.id)).join(', '):'todos alugados')}</div>
  <section><h3>Ranking por resultado acumulado</h3>${tabela([
    {h:'Veículo',f:r=>placaHTML(r.v)+` <small class="muted">${esc(r.v.modelo||'')}</small>${r.parado?' <span class="pill p-warn">Sem contrato</span>':''}${r.status==='vendido'?' <span class="pill">Vendido</span>':''}`},
    {h:'Resultado acumulado',f:r=>`<div style="min-width:150px"><b style="color:${r.acc.res<0?'var(--danger)':'inherit'}">${money(r.acc.res)}</b>${barra(r.acc.res,mx,r.acc.res<0)}</div>`},
    {h:'Receita',n:1,f:r=>money(r.acc.rec)},{h:'Custos',n:1,f:r=>money(r.acc.custo)},{h:'Margem',n:1,f:r=>pct(r.acc.mg)},
    {h:'Km rodado',n:1,f:r=>r.kmRod?kmf(r.kmRod):'—'},{h:'Custo por km',n:1,f:r=>r.custoKm!=null?money(r.custoKm):'—'},
    {h:'Aluguel ÷ compra',n:1,f:r=>r.yieldMes!=null?pct(r.yieldMes,2)+'/mês':'—'},{h:'Retorno sobre a compra',n:1,f:r=>pct(r.roi,1)},
    {h:'Resultado médio (3 meses)',n:1,f:r=>r.med!=null?money(r.med):'—'},{h:'Falta para se pagar',n:1,f:pb}],
    rs,'Sem dados.',r=>`data-go="veiculo" data-id="${r.v.id}" data-tab="fin"`)}</section>
  <div class="note i"><b>Como ler:</b> "Retorno sobre a compra" é o resultado acumulado dividido pelo que o carro custou. "Falta para se pagar" é uma estimativa: quanto ainda falta do preço de compra, dividido pelo resultado médio dos últimos 3 meses. A revenda futura do carro não entra na conta.</div></div>`;
}

/* ---------- fluxo de caixa projetado ---------- */
function fluxoProjetado(n){
  const m0=mesAtual(); const ms=[]; for(let i=0;i<n;i++) ms.push(mesMais(m0,i));
  const mesVenc=d=>{ const m=(d||'').slice(0,7); return !m||m<m0 ? m0 : m; };
  const linhas=ms.map(m=>({m,entFat:0,entPrev:0,saiContas:0,saiRec:0,atrasoE:0,atrasoS:0,itens:[]}));
  const at=m=>linhas.find(l=>l.m===m);
  for(const f of L('faturas').filter(f=>f.status==='aberta')){ const l=at(mesVenc(f.vencimento)); if(!l) continue; l.entFat+=(+f.total||0); if(f.vencimento<hoje()) l.atrasoE+=(+f.total||0); }
  for(const c of L('contratos').filter(c=>c.status!=='encerrado' && c.inicio)){
    for(const l of linhas){ const comp=mesMais(l.m,-1); if(comp<c.inicio.slice(0,7) || (c.fim && comp>c.fim.slice(0,7))) continue;
      if(fatAtivas().some(f=>f.contratoId===c.id && f.competencia===comp)) continue; l.entPrev+=(+c.aluguel||0); } }
  for(const c of L('contas').filter(c=>c.status==='aberta')){ const l=at(mesVenc(c.vencimento)); if(!l) continue; l.saiContas+=(+c.valor||0); if(contaVencida(c)) l.atrasoS+=(+c.valor||0); }
  for(const r of L('recorrencias').filter(r=>r.ativa && r.inicio)){
    for(const l of linhas){ if(l.m<r.inicio || (r.fim && l.m>r.fim)) continue; if(Store.docs['contas/rc_'+r.id+'_'+l.m.replace('-','')]) continue; l.saiRec+=(+r.valor||0); } }
  let acc=0; for(const l of linhas){ l.ent=l.entFat+l.entPrev; l.sai=l.saiContas+l.saiRec; l.saldo=l.ent-l.sai; acc+=l.saldo; l.acc=acc; }
  return linhas;
}
function lerSaldoCaixa(){ try{ return localStorage.getItem('f2_saldo_caixa')||''; }catch(e){ return ''; } }
function vFluxo(){
  const ls=fluxoProjetado(6); const s0=+lerSaldoCaixa()||0; ls.forEach(l=>l.accS=l.acc+s0);
  const ent=ls.reduce((s,l)=>s+l.ent,0), sai=ls.reduce((s,l)=>s+l.sai,0); const pior=ls.reduce((a,l)=>l.accS<a.accS?l:a,ls[0]);
  const mx=Math.max(1,...ls.map(l=>Math.max(l.ent,l.sai))); const W=720,H=210,pl=82,pr=12,pt=14,pb=30; const gw=(W-pl-pr)/ls.length, bw=Math.min(26,gw/3.4);
  const mn=Math.min(0,...ls.map(l=>l.accS)), mxA=Math.max(mx,...ls.map(l=>l.accS)); const Y=v=>H-pb-((v-mn)/(mxA-mn||1))*(H-pt-pb);
  const ticks=[mn,(mn+mxA)/2,mxA]; const pts=ls.map((l,i)=>`${(pl+gw*i+gw/2).toFixed(1)},${Y(l.accS).toFixed(1)}`).join(' ');
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas, saídas e saldo acumulado previstos">${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${eixoR(t)}</text>`).join('')}
    ${mn<0?`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`:''}
    ${ls.map((l,i)=>{ const x=pl+gw*i+gw/2; return `<rect x="${x-bw-2}" y="${Y(l.ent)}" width="${bw}" height="${Math.max(0,Y(0)-Y(l.ent))}" rx="3" fill="var(--accent)"><title>${mesbr(l.m)} · entradas ${money(l.ent)}</title></rect><rect x="${x+2}" y="${Y(l.sai)}" width="${bw}" height="${Math.max(0,Y(0)-Y(l.sai))}" rx="3" fill="var(--amber)"><title>${mesbr(l.m)} · saídas ${money(l.sai)}</title></rect><text x="${x}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${mesbr(l.m)}</text>`; }).join('')}
    <polyline points="${pts}" fill="none" stroke="var(--info)" stroke-width="2.5"/>${ls.map((l,i)=>`<circle cx="${pl+gw*i+gw/2}" cy="${Y(l.accS)}" r="4" fill="var(--info)"><title>${mesbr(l.m)} · saldo acumulado ${money(l.accS)}</title></circle>`).join('')}</svg>`;
  return `<div class="stack"><div class="kpis">${kpi('Entradas previstas',money(ent),'6 meses')}${kpi('Saídas previstas',money(sai),'6 meses')}${kpi('Saldo do período',`<em class="${ent-sai<0?'neg':''}">${money(ent-sai)}</em>`,'')}${kpi('Mês mais apertado',mesbr(pior.m),`saldo acumulado <em class="${pior.accS<0?'neg':''}">${money(pior.accS)}</em>`)}</div>
  <div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h3 style="margin:0">Previsão mês a mês</h3><div class="row" style="gap:14px;font-size:12.5px"><span><span class="lg" style="background:var(--accent)"></span> Entradas</span><span><span class="lg" style="background:var(--amber)"></span> Saídas</span><span><span class="lg" style="background:var(--info)"></span> Saldo acumulado</span></div></div>${svg}
  <div class="row" style="margin-top:8px"><label class="row muted" for="fx_s">Saldo em conta hoje (opcional) <input id="fx_s" type="number" step="0.01" class="btn" style="font-weight:500;width:150px" value="${esc(lerSaldoCaixa())}" placeholder="0,00"></label><small class="muted">Fica salvo só neste aparelho.</small></div></div>
  <section><h3>Detalhe</h3>${tabela([{h:'Mês',f:l=>`<b>${mesbr(l.m)}</b>`},{h:'Faturas em aberto',n:1,f:l=>money(l.entFat)+(l.atrasoE?`<br><small class="neg">${money(l.atrasoE)} em atraso</small>`:'')},{h:'Aluguéis a faturar',n:1,f:l=>money(l.entPrev)},
    {h:'Contas a pagar',n:1,f:l=>money(l.saiContas)+(l.atrasoS?`<br><small class="neg">${money(l.atrasoS)} vencidas</small>`:'')},{h:'Fixas recorrentes',n:1,f:l=>money(l.saiRec)},
    {h:'Saldo do mês',n:1,f:l=>`<b style="color:${l.saldo<0?'var(--danger)':'inherit'}">${money(l.saldo)}</b>`},{h:'Saldo acumulado',n:1,f:l=>`<b style="color:${l.accS<0?'var(--danger)':'inherit'}">${money(l.accS)}</b>`}],ls,'Sem dados.')}</section>
  <div class="note i"><b>De onde vêm os números:</b> entradas são as faturas em aberto (pelo vencimento) e o aluguel dos contratos ativos que ainda vão ser faturados (a fatura vence no mês seguinte ao de uso). Saídas são as contas a pagar lançadas e as contas fixas recorrentes dos próximos meses. Atrasados entram no mês atual. É uma previsão: não inclui reajustes, km excedente, multas nem custos ainda não lançados.</div></div>`;
}

/* ---------- clientes e risco ---------- */
function riscoClientes(){
  const h=hoje(), m0=mesAtual(), m12=mesMais(m0,-11);
  const cs=L('clientes'); const conts=L('contratos'); const fats=fatAtivas();
  const mensalTot=conts.filter(c=>contratoAtivo(c)).reduce((s,c)=>s+(+c.aluguel||0),0);
  const rs=cs.map(cl=>{
    const k=conts.filter(c=>c.clienteId===cl.id); const ka=k.filter(c=>contratoAtivo(c)); const vids=new Set(k.map(c=>c.veiculoId));
    const mensal=ka.reduce((s,c)=>s+(+c.aluguel||0),0);
    const f=fats.filter(x=>x.clienteId===cl.id); const f12=f.filter(x=>x.competencia>=m12 && x.competencia<=m0);
    const rec12=f12.reduce((s,x)=>s+receitaFatura(x),0);
    const atr=f.filter(x=>x.status==='aberta' && x.vencimento && x.vencimento<h); const vAtr=atr.reduce((s,x)=>s+(+x.total||0),0);
    const dias=atr.length? Math.max(...atr.map(x=>Math.round((new Date(h+'T12:00')-new Date(x.vencimento+'T12:00'))/864e5))) : 0;
    const pagas=f.filter(x=>x.status==='paga' && x.vencimento); const noPrazo=pagas.filter(x=>(x.pagoEm||'')<=x.vencimento).length;
    const pont=pagas.length? noPrazo/pagas.length*100 : null;
    const vence=ka.filter(c=>c.fim && c.fim<=addDias(h,90)).sort((a,b)=>a.fim<b.fim?-1:1);
    const multas=L('multas').filter(x=>vids.has(x.veiculoId) && x.statusRepasse==='a_repassar' && +x.valor>0 && k.some(c=>c.veiculoId===x.veiculoId && (x.dataHora||'').slice(0,10)>=c.inicio && (!c.fim||(x.dataHora||'').slice(0,10)<=c.fim)));
    const chs=L('chamados').filter(x=>(x.clienteId===cl.id) && !['resolvido','encerrado'].includes(x.status));
    const share=mensalTot? mensal/mensalTot*100 : 0;
    const motivos=[]; let pts=0;
    if(atr.length){ pts+= dias>30?3:2; motivos.push(`${atr.length} fatura(s) em atraso há até ${dias} dia(s)`); }
    if(pont!=null && pont<70 && pagas.length>=2){ pts+=1; motivos.push(`paga no prazo só ${nf(pont)}% das vezes`); }
    if(share>=40 && ka.length){ pts+=1; motivos.push(`concentra ${nf(share)}% do aluguel mensal`); }
    if(vence.length){ pts+=1; motivos.push(`${vence.length} contrato(s) terminam até ${dbr(vence[vence.length-1].fim)}`); }
    if(multas.length){ motivos.push(`${multas.length} multa(s) a repassar`); }
    const nivel = !ka.length && !atr.length ? 'inativo' : pts>=3?'alto':pts>=1?'medio':'baixo';
    return {cl,ka,mensal,rec12,vAtr,dias,atr,pont,pagas:pagas.length,vence,multas,vMultas:multas.reduce((s,x)=>s+(+x.valor||0),0),chs,share,motivos,nivel,pts};
  }).filter(r=>r.ka.length||r.rec12||r.vAtr);
  return rs.sort((a,b)=>b.pts-a.pts || b.mensal-a.mensal);
}

  {k:'status',l:'Situação',t:'sel',opts:opt(MEL_ST),def:'nova'},{k:'descricao',l:'O que mudar',t:'area',full:1},{k:'motivo',l:'Por quê (problema ou ganho)',t:'area',full:1},
  {k:'resposta',l:'Decisão / resposta',t:'area',full:1}],
  async save(v,id,antes){ if(!antes){ v.origem=v.origem||'usuario'; v.autorNome=v.autorNome||S.me.nome; v.perfilAutor=v.perfilAutor||S.me.perfil; v.vezes=v.vezes||1; } return salvar('melhorias',id,v,antes?(antes.status!==v.status?'mudou situação da sugestão':'editou sugestão'):'anotou sugestão de melhoria'); }};
const MEL_PILL={nova:'p-info',aprovada:'p-ok',em_andamento:'p-warn',feita:'',descartada:''};
function vMelhorias(){
  const f=S.ui.melSt||'abertas'; const ms=L('melhorias').slice().sort((a,b)=>{ const o={alta:0,media:1,baixa:2}; return (o[a.prioridade]??1)-(o[b.prioridade]??1) || ((b.ultimaVez||b.criadoEm||'')>(a.ultimaVez||a.criadoEm||'')?1:-1); });
  const vis=ms.filter(m=>f==='todas'||(f==='abertas'?!['feita','descartada'].includes(m.status):m.status===f)); const cnt=s=>ms.filter(m=>m.status===s).length;
  return head('Melhorias','Sugestões para melhorar o sistema. O assistente anota sozinho o que percebe nas conversas; você também pode anotar. Aprove as que valem a pena e me passe a lista para implementar.',
    `<label class="row muted" for="mel_s">Mostrar <select id="mel_s" class="btn" style="font-weight:500">${[['abertas','Em aberto'],['todas','Todas']].concat(MEL_ST).map(([k,l])=>`<option value="${k}"${k===f?' selected':''}>${l}</option>`).join('')}</select></label>${B('Copiar lista para o Claude','copiarMelhorias')}${B('Nova sugestão','new','data-k="melhorias"',1)}`)+
  `<div class="stack"><div class="kpis">${kpi('Novas',cnt('nova'),'para avaliar')}${kpi('Aprovadas',cnt('aprovada'),'prontas para implementar')}${kpi('Em andamento',cnt('em_andamento'),'')}${kpi('Feitas',cnt('feita'),'')}</div>
  <section>${tabela([{h:'Sugestão',f:m=>`<b>${esc(m.titulo)}</b>${m.descricao?`<br><small class="muted">${esc(m.descricao.slice(0,220))}${m.descricao.length>220?'…':''}</small>`:''}`},
    {h:'Área',f:m=>esc(lbl(MEL_AREAS,m.area))},{h:'Prioridade',f:m=>`<span class="pill ${m.prioridade==='alta'?'p-bad':m.prioridade==='baixa'?'':'p-warn'}">${esc({alta:'Alta',media:'Média',baixa:'Baixa'}[m.prioridade]||'Média')}</span>`},
    {h:'De quem',f:m=>`${m.origem==='assistente'?'<span class="tag">Assistente</span> ':''}${esc(m.autorNome||'')}${m.clienteNome?'<br><small class="muted">'+esc(m.clienteNome)+'</small>':''}`},
    {h:'Vezes',n:1,f:m=>+m.vezes>1?m.vezes:'1'},{h:'Data',f:m=>dbr(m.criadoEm)},{h:'Situação',f:m=>`<span class="pill ${MEL_PILL[m.status]||''}">${esc(lbl(MEL_ST,m.status))}</span>`}],
    vis,'Nenhuma sugestão aqui ainda. Converse com o assistente: ele anota o que perceber.',m=>`data-act="edit" data-k="melhorias" data-id="${m.id}"`)}</section></div>`;
}
function textoMelhorias(){ const ms=L('melhorias').filter(m=>['aprovada','nova','em_andamento'].includes(m.status));
  const ord={aprovada:0,em_andamento:1,nova:2};
  return 'Melhorias do F2 Conect para implementar ('+dbr(hoje())+'):\n\n'+ms.sort((a,b)=>ord[a.status]-ord[b.status]).map((m,i)=>`${i+1}. [${lbl(MEL_ST,m.status)} · prioridade ${m.prioridade||'media'} · ${lbl(MEL_AREAS,m.area)}] ${m.titulo}${m.descricao?'\n   O que mudar: '+m.descricao:''}${m.motivo?'\n   Por quê: '+m.motivo:''}${m.resposta?'\n   Decisão: '+m.resposta:''}${+m.vezes>1?'\n   Apareceu '+m.vezes+' vezes':''}${m.clienteNome?'\n   Pedido de: '+m.clienteNome:''}`).join('\n\n'); }

const r0=()=>S.route; let _rt=null; function agenda(){ clearTimeout(_rt); _rt=setTimeout(render,40); }
function render(){
  const main=$('#main');
  if(!S.db || !S.me){ return; }
  agGarantir();
  if(ehCliente()){ const ae0=document.activeElement; if(document.querySelector('dialog[open]') && ae0 && ae0.closest && ae0.closest('dialog')) { /* mantém o formulário aberto */ } renderPortal(); return; }
  if(!pode(S.route.view)) S.route.view='painel';
  const ae=document.activeElement; if(r0().view==='config' && ae && $('#cfgf') && $('#cfgf').contains(ae)) return;
  const al=alertas(); S._al=al; renderNav(al);
  const r=S.route; let h='';
  switch(r.view){
    case 'painel': h=vPainel(al); break; case 'clientes': h=vClientes(); break; case 'cliente': h=vCliente(r.id); break;
    case 'veiculos': h=vVeiculos(); break; case 'veiculo': h=vVeiculo(r.id); break; case 'contratos': h=vContratos(); break;
    case 'uso': h=vUso(); break; case 'abast': h=vAbastF2(); break; case 'manut': h=vManut(); break; case 'reemb': h=vReemb(); break; case 'multas': h=vMultas(); break;
    case 'docs': h=vDocs(); break; case 'vistorias': h=vVistorias(); break; case 'faturas': case 'receber': h=vReceber(); break; case 'financeiro': case 'resultado': h=vResultado(); break; case 'fixas': h=vContas('fixa'); break; case 'variaveis': h=vContas('variavel'); break; case 'config': h=vConfig(); break; case 'auditoria': h=vAuditoria(); break; case 'melhorias': h=vMelhorias(); break;
  }
  const bf=document.activeElement&&document.activeElement.id==='vbusca'; const pos=bf?document.activeElement.selectionStart:null;
  const sy=window.scrollY; main.innerHTML=h; window.scrollTo(0,sy);
  if(r.view==='config') bindConfig();
  if(r.view==='veiculos'){ filtrarVeiculos(S.ui.busca||''); if(bf){ const i=$('#vbusca'); if(i){ i.focus(); try{ i.setSelectionRange(pos,pos); }catch(e){} } } }
}
function go(view,id,tab){ S.route={view,id}; if(view==='veiculo') S.ui.vtab=tab||'resumo'; if(view==='cliente') S.ui.ctab=tab||'resumo'; if(['fixas','variaveis'].includes(view)) gerarRecorrentes().then(n=>{ if(n) render(); }); window.scrollTo(0,0); render(); }

  setTimeout(()=>fim(null),9000);
  try{ navigator.geolocation.getCurrentPosition(p=>fim({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),precisao:Math.round(p.coords.accuracy||0)}),()=>fim(null),{enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }catch(e){ fim(null); } }); }

async function enviarArqs(input, cid, sub, rotulo){ const out=[]; if(!input||!input.files||!input.files.length) return out; let n=0;

function csv(nome, linhas, cols){ const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';

const addMeses = (iso,n) => { const d=new Date(iso.slice(0,10)+'T12:00'); d.setMonth(d.getMonth()+(+n)); return isoD(d); };
function kmNoPeriodo(vid, ini, fim){ const ls=leiturasV(vid); const dentro=ls.filter(l=>{const d=l.data.slice(0,10); return d>=ini&&d<=fim;}); if(!dentro.length) return 0;
  const antes=ls.filter(l=>l.data.slice(0,10)<ini); const base=antes.length? +antes[antes.length-1].km : Math.min(...dentro.map(l=>+l.km));
  return Math.max(0, Math.max(...dentro.map(l=>+l.km))-base); }

/* ---------- manutenção preventiva ---------- */
const PREV_ITENS=[['preventiva','Revisão','pvRevKm','pvRevMeses'],['oleo','Troca de óleo','pvOleoKm','pvOleoMeses'],['alinhamento','Alinhamento e balanceamento','pvAlinKm','pvAlinMeses']];
function preventivas(v){
  const P=cfg(); const pd0=P.prev||{}; const km=kmAtual(v); const h=hoje(); const out=[];
  for(const [cat,nome,kk,km_] of PREV_ITENS){
    const ik=+(v[kk]||pd0[kk]||0), im=+(v[km_]||pd0[km_]||0);
    const m=L('manutencoes').filter(x=>x.veiculoId===v.id&&x.categoria===cat&&!['cancelada','agendada'].includes(x.status)).sort((a,b)=>a.data<b.data?1:-1)[0];
    let pk=null, pd=null, base='ultimo';
    if(m){ pk = m.proximaKm ? +m.proximaKm : (ik && m.km ? +m.km+ik : null); pd = m.proximaData || (im && m.data ? addMeses(m.data,im) : null); }
    else if(ik||im){ base='cadastro'; pk = ik ? (+v.kmInicial||0)+ik : null; pd = im && v.aqData ? addMeses(v.aqData,im) : null; }
    if(pk==null && !pd) continue;
    const faltaKm = pk!=null ? pk-km : null, faltaD = pd ? diff(h,pd) : null;
    const st = ((faltaKm!=null&&faltaKm<=0)||(faltaD!=null&&faltaD<0)) ? 'vencida' : ((faltaKm!=null&&faltaKm<=(+P.prevAvisoKm||1000))||(faltaD!=null&&faltaD<=(+P.prevAvisoDias||30))) ? 'proxima' : 'ok';
    out.push({cat,nome,ult:m||null,pk,pd,faltaKm,faltaD,st,base});
  }
  return out;
}
const PREV_ST={ok:['p-ok','Em dia'],proxima:['p-warn','Próxima'],vencida:['p-bad','Vencida']};
function prevHTML(v, comBotao){
  const ps=preventivas(v);
  const linhas=ps.map(p=>`<div class="row" style="justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px"><div style="min-width:0"><b>${esc(p.nome)}</b> <span class="pill ${PREV_ST[p.st][0]}">${PREV_ST[p.st][1]}</span><br>
    <small class="muted">Próxima: ${[p.pk!=null?kmf(p.pk)+(p.faltaKm!=null?(p.faltaKm>0?' (faltam '+kmf(p.faltaKm)+')':' (passou '+kmf(-p.faltaKm)+')'):''):'',p.pd?'até '+dbr(p.pd):''].filter(Boolean).join(' · ')}</small><br>
    <small class="muted">${p.ult?'Último: '+dbr(p.ult.data)+(p.ult.km?' · '+kmf(p.ult.km):''):'Sem serviço registrado: estimativa pelo cadastro do veículo'}</small></div></div>`).join('');
  return `<section class="card stack" style="gap:8px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Manutenção preventiva</h3>${comBotao?B('Registrar serviço feito','pform','data-k="p_preventiva" data-id="'+v.id+'"'):''}</div>
    ${linhas||'<p class="muted" style="margin:0">Nenhum plano de preventiva definido para este veículo.</p>'}<small class="muted">Combustível, revisões, óleo e alinhamento ficam a cargo do cliente. Registre cada serviço com a nota para manter o histórico do carro.</small></section>`;
}

function consumoComb(vid){
  const fs=L('abastecimentos').filter(a=>a.veiculoId===vid && +a.km>0).sort((a,b)=>+a.km-+b.km); const kml={}; let ultCheio=null, litros=0, totKm=0, totL=0;
  for(const a of fs){ litros+=+a.litros||0; if(a.tanqueCheio){ if(ultCheio && +a.km>+ultCheio.km && litros>0){ kml[a.id]=(+a.km-+ultCheio.km)/litros; totKm+=+a.km-+ultCheio.km; totL+=litros; } ultCheio=a; litros=0; } }
  return {kml, media: totL? totKm/totL : null};
}

const QR_KEY='f2_qr';
function qrGuardar(v){ try{ localStorage.setItem(QR_KEY,JSON.stringify({v,ts:Date.now()})); }catch(e){} }
function qrPendente(){ try{ const o=JSON.parse(localStorage.getItem(QR_KEY)||'null'); return o && Date.now()-o.ts<6*36e5 ? o.v : null; }catch(e){ return null; } }
function qrLimpar(){ try{ localStorage.removeItem(QR_KEY); }catch(e){} }
(function(){ try{ const v=new URLSearchParams(location.search).get('v'); if(v){ qrGuardar(v); history.replaceState(null,'',location.pathname+location.hash); } }catch(e){} })();
function tratarQR(){
  const v=qrPendente(); if(!v) return; qrLimpar();
  if(ehEquipe()){ if(G('veiculos',v)) go('veiculo',v,'uso'); return; }
  if(!ehCliente()) return;
  if(!idsVeic().has(v)){ toast('Este veículo não está com a sua empresa agora.'); return; }
  S.p.vid=v; S.p.vtab='resumo'; render();
  const u=usoAberto(v); if(u && (ehGestor()||u.condutorId===S.me.condutorId)) openCheckout(v); else openCheckin(v);
}

/* ---------- avisos do portal ---------- */
function pAlertasMot(){

  const mu=meuUsoAberto();
  if(mu){ const v=G('veiculos',mu.veiculoId); const pl=PL(mu.veiculoId); const hrs=(new Date(agora())-new Date(mu.inicio))/36e5;
    if(hrs>P.horasCheckin) add('w',`Você está com ${pl} há ${Math.floor(hrs)} h`,'Se já devolveu o carro, faça o checkout.',{act:'checkout',id:mu.veiculoId,lbl:'Fazer checkout'});
    if(v) for(const p of preventivas(v).filter(p=>p.st!=='ok')) add(p.st==='vencida'?'w':'i',`${p.nome} ${p.st==='vencida'?'vencida':'chegando'} em ${pl}`,`${p.pk!=null?(p.faltaKm>0?'Faltam '+kmf(p.faltaKm):'Passou '+kmf(-p.faltaKm)):''}${p.pd?' · prazo '+dbr(p.pd):''}. Avise o gestor da sua empresa.`); }
  const mc=meuCondutor(); if(mc&&mc.cnhValidade&&diff(h,mc.cnhValidade)<=P.diasAvisoVenc) add('w',`Sua CNH ${mc.cnhValidade<h?'está vencida':'vence em '+diff(h,mc.cnhValidade)+' dias'}`,'Atualize em Meu cadastro.',{act:'ptab',tab:'cadastro',lbl:'Meu cadastro'});
  for(const c of LC('chamados').filter(ehMeu)){ const hs=c.historico||[]; const ult=hs[hs.length-1]; if(ult && hs.length>1 && diff(locISO(ult.ts),h)<=3) add('i',`Chamado #${c.numero}: ${lbl(CH_ST,c.status)}`,(c.respostaF2||c.descricao||'').slice(0,90),{act:'ptab',tab:'registros',lbl:'Ver chamado'}); }
  const o={b:0,w:1,i:2}; return A.sort((a,b)=>o[a.sev]-o[b.sev]);
}

/* ---------- três portas: /f2, /cliente e /motorista ---------- */
const PORTA = (location.pathname.match(/^\/(f2|cliente|motorista)(\/|$)/)||[])[1] || null;
const PORTAS = {f2:{nome:'Área da F2',quem:'equipe da F2 Carloc'},cliente:{nome:'Área do cliente',quem:'administrativo da empresa cliente'},motorista:{nome:'Área do motorista',quem:'motorista'}};
const portaDoPerfil = p => ['admin','operacional','financeiro'].includes(p)?'f2':p==='gestor'?'cliente':p==='condutor'?'motorista':null;
function telaPortas(){
  telaShell(`<h1>F2 Conect</h1><p class="muted" style="margin:0">Escolha a sua área.</p><div class="stack" style="gap:10px">
    <a class="porta" href="/motorista"><b>Sou motorista</b><small>Check-in e checkout, abastecimento, vistoria por foto e chamado de manutenção.</small></a>
    <a class="porta" href="/cliente"><b>Sou da empresa cliente</b><small>Administrativo: carros, contratos, km, faturas, multas e motoristas.</small></a>
    <a class="porta" href="/f2"><b>Sou da F2 Carloc</b><small>Painel interno da locadora.</small></a></div>`);
}
function telaPortaErrada(user, porta){
  telaShell(`<h1>Esta é a ${esc(PORTAS[PORTA].nome)}</h1><p class="muted">Sua conta (${esc(user.email)}) é da <b>${esc(PORTAS[porta].nome)}</b>, para ${esc(PORTAS[porta].quem)}.</p><div class="row"><a class="btn pri" href="/${porta}">Ir para a ${esc(PORTAS[porta].nome)}</a><button class="btn ghost" id="sx">Entrar com outra conta</button></div>`);

}
/* ---------- "Ver como" (equipe F2) ---------- */

    <div class="fld"><label for="vc_c">Cliente</label><select id="vc_c">${cs.map(c=>`<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('')}</select></div>

    <div class="df"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" id="fsub">Ver</button></div></form>`;

function sairVerComo(){ if(!S.preview) return; S.me=S.preview.me; const r=S.preview.route; S.preview=null; document.querySelector('.app').classList.remove('portal'); S.route=r||{view:'painel'}; render(); }
const ACOES_VER=['ptab','pv','pback','pvtab','sairVerComo','csvUso','csvAbast','qr','seguro','emerg'];

/* ---------- cadastro do motorista pelo QR (conta ainda sem acesso) ---------- */
function telaCadastroMotorista(user, perfil, vid){
  telaShell(`<h1>Cadastro de motorista</h1><p class="muted">Você leu o QR code de um carro. Preencha seus dados: o gestor da sua empresa confere e libera o acesso ao check-in.</p>
  <form class="card stack" id="cm"><div class="fld"><label for="cm_n">Nome completo</label><input id="cm_n" required value="${esc(perfil.nome&&perfil.nome!==user.email?perfil.nome:'')}" autocomplete="name"></div>
  <div class="fgrid"><div class="fld"><label for="cm_c">CPF</label><input id="cm_c" required inputmode="numeric"></div><div class="fld"><label for="cm_t">Telefone (WhatsApp)</label><input id="cm_t" required inputmode="tel" autocomplete="tel"></div>
  <div class="fld"><label for="cm_h">Nº da CNH</label><input id="cm_h" required inputmode="numeric"></div><div class="fld"><label for="cm_v">Validade da CNH</label><input id="cm_v" type="date" required></div></div>
  <div class="fld chk"><input id="cm_l" type="checkbox"><label for="cm_l">Estou ciente de que o app registra quem usa o carro, o km e a localização no momento do check-in e do checkout (LGPD).</label></div>
  <p class="hint" id="cm_x" hidden style="color:var(--danger)"></p><button class="btn pri" id="cm_b">Enviar para o gestor</button></form><button class="btn ghost" id="sx">Sair</button>`);
  $('#sx').onclick=sair;
  $('#cm').onsubmit=async e=>{ e.preventDefault(); const x=$('#cm_x'); x.hidden=true; const g=id=>$(id).value.trim();
    if(!g('#cm_n')||!g('#cm_c')||!g('#cm_t')||!g('#cm_h')||!g('#cm_v')){ x.textContent='Preencha todos os campos.'; x.hidden=false; return; }

    if(error){ $('#cm_b').disabled=false; x.textContent=error.message||'Não foi possível enviar.'; x.hidden=false; return; }

}

/* ===================== backup e importação ===================== */
function baixarArquivo(nome,blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
async function backup(){
  const regs=Object.entries(Store.docs).map(([p,e])=>{ const i=p.indexOf('/'); return {colecao:p.slice(0,i),id:p.slice(i+1),dados:e.d,cliente_id:e.cid}; });
  baixarArquivo(`f2-conect-backup-${hoje()}.json`, new Blob([JSON.stringify({app:'F2 Conect',formato:'supabase-1',exportadoEm:new Date().toISOString(),registros:regs},null,2)],{type:'application/json'}));
  toast('Backup exportado. Os anexos continuam no Storage do Supabase.');
}
async function importar(file){
  let j; try{ j=JSON.parse(await file.text()); }catch(e){ toast('Arquivo inválido.'); return; }
  const regs=[];
  if(Array.isArray(j.registros)) j.registros.forEach(r=>regs.push([r.colecao,r.id,r.dados]));
  else { if(j.config) regs.push(['config','geral',(({id,...x})=>x)(j.config)]); for(const c of COLS.concat(['auditoria'])) (j[c]||[]).forEach(d=>{ const {id,...x}=d; if(id) regs.push([c,id,x]); }); }
  { const r2=[]; for(const [c,id,d] of regs){ if(c==='veiculos'){ const fin={},pub={}; for(const [k,x] of Object.entries(d||{})) (FIN_V(k)?fin:pub)[k]=x; r2.push([c,id,pub]); if(Object.keys(fin).length) r2.push(['veiculos_fin',id,fin]); }
      else if(c==='config' && id==='geral' && (d.planos||[]).length){ r2.push(['config','planos',{lista:d.planos}]); r2.push([c,id,{...d,planos:[]}]); } else r2.push([c,id,d]); } regs.length=0; regs.push(...r2); }
  if(!regs.length){ toast('Nenhum registro encontrado no arquivo.'); return; }
  const ok=await perguntar('Importar backup',`Serão gravados ${regs.length} registros. Os que tiverem o mesmo identificador serão substituídos. Anexos do painel de teste não vêm junto: reenvie os PDFs pelos formulários.`,'Importar');
  if(!ok) return;
  for(const [c,id,d] of regs) if(!Store.docs[c+'/'+id]) Store.docs[c+'/'+id]={d,cid:null};
  Store.ver++;
  const agoraISO=new Date().toISOString();
  const rows=regs.map(([c,id,d])=>({colecao:c,id,dados:d,cliente_id:clienteDe(c,d,id),atualizado_em:agoraISO,atualizado_por:S.uid}));
  for(let i=0;i<rows.length;i+=200){ const {error}=await Supa.sb.from('registros').upsert(rows.slice(i,i+200),{onConflict:'colecao,id'}); if(error){ toast(erroSupa(error)); await carregarTudo(); return; } }
  await carregarTudo(); audit('importou backup','config','geral',regs.length+' registros'); toast(`Backup importado: ${regs.length} registros.`);
}

/* ===================== conexão, login e sessão ===================== */
function credenciais(){ if(CONF.supabaseUrl && CONF.supabaseAnonKey) return {url:CONF.supabaseUrl,key:CONF.supabaseAnonKey,fixo:true}; try{ return JSON.parse(localStorage.getItem('f2_supabase')||'null'); }catch(e){ return null; } }
function telaShell(html){ const app=document.querySelector('.app'); app.classList.add('portal','setup'); $('#main').innerHTML=`<div class="setup-box"><div class="brand"><div class="brand-mark">F2</div><div><b>F2 Conect</b><small>${esc(PORTA?PORTAS[PORTA].nome:'F2 Carloc')}</small></div></div>${html}${PORTA?'<p style="margin:4px 0 0"><a class="btn ghost sm" href="/">Trocar de área</a></p>':''}</div>`; }
async function boot(){
  if(!window.supabase || !window.supabase.createClient){ telaShell('<h1>Sem conexão</h1><p class="muted">Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue a página.</p>'); return; }
  const cr=credenciais(); if(!cr){ telaConexao(); return; }
  Supa.sb=window.supabase.createClient(cr.url,cr.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'f2conect-auth'}});
  Supa.sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY') telaNovaSenha(); });
  if(/type=recovery/.test(location.hash)) return;
  let sess=null; try{ sess=(await Supa.sb.auth.getSession()).data.session; }catch(e){}
  if(!PORTA){
    if(qrPendente()){ location.replace('/motorista'); return; }
    if(sess){ try{ const {data:p}=await Supa.sb.from('perfis').select('perfil,ativo').eq('id',sess.user.id).maybeSingle(); const porta=p&&p.ativo&&portaDoPerfil(p.perfil); if(porta){ location.replace('/'+porta); return; } }catch(e){} }
    telaPortas(); return; }
  if(!sess){ telaLogin(); return; }
  await iniciarSessao(sess.user);
}
function telaConexao(msg){
  telaShell(`<h1>Conectar ao Supabase</h1><p class="muted">Informe os dados do projeto (Supabase → Project Settings → API). Para não pedir de novo em cada computador, preencha o arquivo config.js antes de publicar.</p>${msg?`<div class="note b">${esc(msg)}</div>`:''}
   <form class="card stack" id="cx"><div class="fld"><label for="cx_u">Project URL</label><input id="cx_u" placeholder="https://xxxx.supabase.co" required></div><div class="fld"><label for="cx_k">Chave pública (anon / publishable)</label><input id="cx_k" required></div><button class="btn pri">Conectar</button></form>`);
  $('#cx').onsubmit=async e=>{ e.preventDefault(); const url=$('#cx_u').value.trim().replace(/\/$/,''), key=$('#cx_k').value.trim();
    try{ const sb=window.supabase.createClient(url,key,{auth:{persistSession:false}}); const r=await sb.from('perfis').select('id').limit(1); if(r.error) throw r.error; }
    catch(err){ telaConexao('Não consegui acessar o banco: '+(err.message||err)+'. Confira a URL, a chave e se o script instalacao.sql foi executado no SQL Editor.'); return; }
    try{ localStorage.setItem('f2_supabase',JSON.stringify({url,key})); }catch(e){}
    location.reload(); };
}
function telaLogin(modo){
  const cad=modo==='cadastro', rec=modo==='recuperar';
  const qr=qrPendente();
  telaShell(`${qr&&!rec?'<div class="note i"><b>QR code do carro lido.</b> Entre com sua conta para fazer o check-in. Primeira vez? Toque em <b>Criar conta</b>.</div>':''}<h1>${cad?'Criar conta':rec?'Recuperar senha':'Entrar'}</h1><p class="muted">${cad?({f2:'Conta para a equipe da F2. Um administrador libera o acesso.',cliente:'Conta para o administrativo da empresa cliente. A F2 libera o acesso.',motorista:qr?'Depois de criar, você preenche seus dados de motorista e o gestor da sua empresa libera.':'Depois de criar, o gestor da sua empresa libera o acesso. Dica: leia o QR code colado no carro.'}[PORTA]):rec?'Enviaremos um link para você criar uma nova senha.':'Use seu e-mail e senha.'}</p>
  <form class="card stack" id="lg">${cad?'<div class="fld"><label for="lg_n">Nome completo</label><input id="lg_n" required autocomplete="name"></div>':''}<div class="fld"><label for="lg_e">E-mail</label><input id="lg_e" type="email" autocomplete="email" required></div>${rec?'':`<div class="fld"><label for="lg_s">Senha</label><input id="lg_s" type="password" autocomplete="${cad?'new-password':'current-password'}" minlength="6" required>${cad?'<span class="hint">Mínimo de 6 caracteres.</span>':''}</div>`}<p class="hint" id="lg_x" hidden style="color:var(--danger)"></p><button class="btn pri" id="lg_b">${cad?'Criar conta':rec?'Enviar link':'Entrar'}</button></form>
  <p class="row"><button class="btn ghost sm" id="lg_t">${cad||rec?'Voltar para entrar':'Criar conta'}</button>${cad||rec?'':'<button class="btn ghost sm" id="lg_r">Esqueci minha senha</button>'}${credenciais()&&!credenciais().fixo?'<button class="btn ghost sm" id="lg_c">Trocar projeto</button>':''}</p>`);
  $('#lg_t').onclick=()=>telaLogin(cad||rec?'':'cadastro'); const r=$('#lg_r'); if(r) r.onclick=()=>telaLogin('recuperar');
  const cc=$('#lg_c'); if(cc) cc.onclick=()=>{ try{ localStorage.removeItem('f2_supabase'); }catch(e){} location.reload(); };
  $('#lg').onsubmit=async e=>{ e.preventDefault(); const x=$('#lg_x'); x.hidden=true; $('#lg_b').disabled=true; const email=$('#lg_e').value.trim();
    let res;
    if(rec) res=await Supa.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/'+(PORTA||'')});
    else if(cad) res=await Supa.sb.auth.signUp({email,password:$('#lg_s').value,options:{data:{nome:$('#lg_n').value.trim()},emailRedirectTo:location.origin+'/'+(PORTA||'')}});
    else res=await Supa.sb.auth.signInWithPassword({email,password:$('#lg_s').value});
    $('#lg_b').disabled=false;
    if(res.error){ x.textContent=/Invalid login/i.test(res.error.message)?'E-mail ou senha incorretos.':/Email not confirmed/i.test(res.error.message)?'Confirme seu e-mail pelo link enviado antes de entrar.':res.error.message; x.hidden=false; return; }
    if(rec){ telaShell('<h1>Verifique seu e-mail</h1><p class="muted">Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.</p><button class="btn" id="vb">Voltar</button>'); $('#vb').onclick=()=>telaLogin(); return; }
    if(!res.data.session){ telaShell('<h1>Confirme seu e-mail</h1><p class="muted">Enviamos um link de confirmação. Depois de confirmar, volte e entre com seu e-mail e senha.</p><button class="btn" id="vb">Voltar para entrar</button>'); $('#vb').onclick=()=>telaLogin(); return; }
    iniciarSessao(res.data.session.user); };
}
function telaNovaSenha(){
  telaShell(`<h1>Nova senha</h1><form class="card stack" id="ns"><div class="fld"><label for="ns_s">Nova senha</label><input id="ns_s" type="password" minlength="6" required autocomplete="new-password"></div><p class="hint" id="ns_x" hidden style="color:var(--danger)"></p><button class="btn pri">Salvar senha</button></form>`);
  $('#ns').onsubmit=async e=>{ e.preventDefault(); const {error}=await Supa.sb.auth.updateUser({password:$('#ns_s').value}); if(error){ const x=$('#ns_x'); x.textContent=error.message; x.hidden=false; return; } history.replaceState(null,'',location.pathname); toast('Senha alterada.'); const s=(await Supa.sb.auth.getSession()).data.session; if(s) iniciarSessao(s.user); else telaLogin(); };
}
async function sair(){ try{ await Supa.sb.auth.signOut(); }catch(e){} location.reload(); }
async function carregarTudo(){
  const docs={}; const step=1000;
  for(let from=0;;from+=step){ const {data,error}=await Supa.sb.from('registros').select('colecao,id,dados,cliente_id').order('colecao').order('id').range(from,from+step-1); if(error) throw error; for(const r of data) docs[r.colecao+'/'+r.id]={d:r.dados,cid:r.cliente_id}; if(data.length<step) break; }
  Store.docs=docs; Supa.ultimaCarga=Date.now(); Store.notify();
}
async function carregarPerfis(){ const {data}=await Supa.sb.from('perfis').select('*').order('nome'); S.perfis=data||[]; }
async function iniciarSessao(user){
  let {data:p,error}=await Supa.sb.from('perfis').select('*').eq('id',user.id).maybeSingle();
  if(error){ telaConexao('O banco não respondeu como esperado: '+error.message+'. Rode o script instalacao.sql.'); return; }
  if(p && !p.ativo && p.perfil==='pendente'){ try{ const r=await Supa.sb.rpc('f2_vincular'); if(r.data){ const r2=await Supa.sb.from('perfis').select('*').eq('id',user.id).maybeSingle(); if(r2.data) p=r2.data; } }catch(e){} }
  if(p && !p.ativo && PORTA==='motorista' && qrPendente() && (p.perfil==='pendente' || (p.perfil==='condutor' && !p.cliente_id))){ telaCadastroMotorista(user,p,qrPendente()); return; }
  if(p && p.ativo && p.perfil!=='pendente'){ const porta=portaDoPerfil(p.perfil); if(porta && porta!==PORTA){ telaPortaErrada(user,porta); return; } }
  if(!p || !p.ativo || p.perfil==='pendente'){ const mot=p&&p.perfil==='condutor';
    const txt = mot ? 'O gestor da sua empresa precisa conferir seus dados e liberar o seu acesso.'
      : PORTA==='motorista' ? 'O gestor da sua empresa precisa liberar o seu acesso. Peça para ele cadastrar você com este e-mail, ou leia o QR code colado no carro.'
      : PORTA==='cliente' ? 'A F2 Carloc precisa liberar o seu acesso.' : 'Um administrador da F2 precisa liberar o seu acesso.';
    telaShell(`<h1>${mot?'Cadastro enviado ao gestor':'Acesso aguardando liberação'}</h1><p class="muted">Sua conta (${esc(user.email)}) foi criada. ${txt}</p><div class="row"><button class="btn" id="vn">Verificar de novo</button><button class="btn ghost" id="sx">Sair</button></div>`); $('#vn').onclick=()=>location.reload(); $('#sx').onclick=sair; return; }
  if(['gestor','condutor'].includes(p.perfil) && !p.cliente_id){ telaShell('<h1>Perfil incompleto</h1><p class="muted">Seu usuário ainda não está vinculado a um cliente. Peça à F2 para completar o cadastro.</p><button class="btn" id="sx">Sair</button>'); $('#sx').onclick=sair; return; }
  S.me={id:user.id,email:user.email,nome:p.nome||user.email,perfil:p.perfil,clienteId:p.cliente_id,condutorId:p.condutor_id}; S.uid=user.id;
  telaShell('<h1>Carregando…</h1><p class="muted">Sincronizando os dados.</p>');
  try{ await carregarTudo(); }catch(e){ telaConexao('Erro ao ler os dados: '+(e.message||e)); return; }
  if(ehEquipe()||p.perfil==='gestor') await carregarPerfis();
  Supa.sb.rpc('f2_registrar_acesso').then(()=>{},()=>{});
  S.db=LocalDB; S.assets={upload:(f,cid)=>Anexos.salvar(f,cid)};
  Supa.chan=Supa.sb.channel('f2-registros').on('postgres_changes',{event:'*',schema:'public',table:'registros'},pl=>Store.aplicar(pl))
    .subscribe(st=>{ if(st==='SUBSCRIBED'){ if(Supa.caiu){ Supa.caiu=false; carregarTudo().catch(()=>{}); } setSync('ok'); } else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(st)){ Supa.caiu=true; setSync('off'); } });
  Store.subs.add(agenda);
  const app=document.querySelector('.app'); app.classList.remove('setup'); app.classList.toggle('portal',ehCliente());
  S.route={view:ehCliente()?'p':'painel'}; S.p={tab:'inicio',vid:null,f:{},vtab:'resumo'};
  window.addEventListener('focus',()=>{ if(Date.now()-Supa.ultimaCarga>120000) carregarTudo().catch(()=>{}); });
  render(); tratarQR(); if(ehEquipe()) gerarRecorrentes().then(n=>{ if(n){ toast(n+' conta(s) fixa(s) do mês gerada(s).'); render(); } });
  setInterval(()=>{ if(!document.querySelector('dialog[open]')) render(); }, 60000);
}
boot();
