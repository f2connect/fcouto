<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>F2 Conect</title>
<meta name="theme-color" content="#0b6a4c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral fixa de módulos + área de trabalho; no celular a barra vira faixa rolável no topo.
   Identidade: verde de placa de sinalização rodoviária, âmbar de faixa de pista, placa Mercosul nos veículos. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e9eeec; --line:#d5dcd9; --fg:#16201c; --muted:#56635d;
  --accent:#0b6a4c; --accent-fg:#ffffff; --accent-soft:#dcefe7;
  --amber:#a87104; --warn-bg:#fdf1d3; --danger:#b3322a; --danger-bg:#fbe5e2; --ok:#1d7446; --ok-bg:#e1f2e8; --info:#215488; --info-bg:#e3edf8;
  --plate-bg:#ffffff; --plate-fg:#101418; --plate-band:#1b3f8f; --plate-edge:#9aa4a0;
  --shadow:0 1px 2px rgba(16,32,26,.06),0 4px 14px rgba(16,32,26,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1c2622; --line:#2a3631; --fg:#e4ebe8; --muted:#97a6a0;
  --accent:#3db187; --accent-fg:#04120c; --accent-soft:#16352a;
  --amber:#e6b03c; --warn-bg:#382c0d; --danger:#ef7b6f; --danger-bg:#3b1b18; --ok:#5cc88e; --ok-bg:#12301f; --info:#80b3e6; --info-bg:#14273a;
  --plate-edge:#55625c; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1c2622; --line:#2a3631; --fg:#e4ebe8; --muted:#97a6a0;
  --accent:#3db187; --accent-fg:#04120c; --accent-soft:#16352a;
  --amber:#e6b03c; --warn-bg:#382c0d; --danger:#ef7b6f; --danger-bg:#3b1b18; --ok:#5cc88e; --ok-bg:#12301f; --info:#80b3e6; --info-bg:#14273a;
  --plate-edge:#55625c; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.02em}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--fg);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.cnt{font-family:var(--f-mono);font-size:11px;min-width:22px;text-align:center;border-radius:10px;padding:1px 6px;background:var(--danger-bg);color:var(--danger)}
.main{padding-block:22px 60px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw);min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:30px;line-height:1.1;margin:0;letter-spacing:.005em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:20px;margin:0;letter-spacing:.01em}
h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:23px;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:13px}
.muted{color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--amber)}.p-bad{background:var(--danger-bg);color:var(--danger)}.p-info{background:var(--info-bg);color:var(--info)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.plate{display:inline-flex;flex-direction:column;border:1.5px solid var(--plate-edge);border-radius:5px;background:var(--plate-bg);color:var(--plate-fg);overflow:hidden;line-height:1;min-width:88px}
.plate i{display:block;background:var(--plate-band);color:#fff;font-style:normal;font-size:7px;letter-spacing:.2em;text-align:center;padding:2px 0 1px;font-family:var(--f-body);font-weight:600}
.plate b{font-family:var(--f-mono);font-size:15px;letter-spacing:.06em;padding:4px 8px 3px;text-align:center}
.plate.lg b{font-size:22px;padding:6px 14px 5px}.plate.lg i{font-size:9px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.vcard:hover{border-color:var(--accent)}
.vcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vcard .model{font-weight:600}
.kmbar{display:flex;flex-direction:column;gap:4px}
.kmbar .trk{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.kmbar .fil{height:100%;background:var(--accent);border-radius:4px}
.kmbar .fil.w{background:var(--amber)}.kmbar .fil.b{background:var(--danger)}
.kmbar .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--surface-2)}
.alert .sev{align-self:stretch;border-radius:3px;background:var(--muted)}
.alert .sev.b{background:var(--danger)}.alert .sev.w{background:var(--amber)}.alert .sev.i{background:var(--info)}
.alert b{font-weight:600;display:block}
.alert small{color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
dl.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px;margin:0}
dl.info div{min-width:0}
dl.info dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dl.info dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:96px 14px minmax(0,1fr);gap:10px;padding:8px 0}
.timeline .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;padding-top:2px}
.timeline .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 3px var(--accent-soft)}
.timeline .dot.w{background:var(--amber)}.timeline .dot.b{background:var(--danger)}.timeline .dot.i{background:var(--info)}
.note{border-left:3px solid var(--amber);background:var(--warn-bg);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}
.note.i{border-color:var(--info);background:var(--info-bg)}
.note.b{border-color:var(--danger);background:var(--danger-bg)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,16,12,.45)}
dialog form,dialog .dbody{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dc{padding:16px 18px;overflow:auto}
.df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:72px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk input{width:auto}
.sec{grid-column:1/-1;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.banner{background:var(--warn-bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.chart{width:100%;height:auto;display:block}
.ex{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--info);background:var(--info-bg);border-radius:4px;padding:1px 5px;vertical-align:middle}
a{color:var(--accent)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand{padding:0 2px 8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav .grp{display:none}
  .nav button{width:auto;white-space:nowrap}
  .grid2,.fgrid{grid-template-columns:minmax(0,1fr)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app.portal{grid-template-columns:minmax(0,1fr)}
.app.portal .side{display:none}
.app.portal .main{width:100%;max-width:900px;margin:0 auto}
.setup-box{max-width:560px;margin:4vh auto 0;display:flex;flex-direction:column;gap:14px}
.setup-box .brand{padding:0}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ptabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:18px;border-bottom:1px solid var(--line)}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;cursor:pointer;font-weight:600;font-size:15px;min-height:66px;color:var(--fg)}
.qa button:hover{border-color:var(--accent)}
.qa button small{font-weight:400;color:var(--muted);font-size:12.5px}
.qa button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.qa button.pri small{color:inherit;opacity:.85}
.qa button.sos{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.qa button.sos small{color:var(--danger)}
.side-foot{margin-top:18px;padding:12px 6px 0;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sync{font-size:12px;font-weight:600;border-radius:12px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.sync.s-ok{background:var(--ok-bg);color:var(--ok)}.sync.s-salvando{background:var(--warn-bg);color:var(--amber)}.sync.s-erro,.sync.s-off{background:var(--danger-bg);color:var(--danger)}
.chklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.chklist label{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--fg);font-size:14px}
details summary{cursor:pointer}
@media (max-width:560px){ .alert{grid-template-columns:6px minmax(0,1fr)} .alert>.btn{grid-column:2;justify-self:start} .alert>span:last-child:empty{display:none} }
.porta{display:block;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px 18px}
.porta:hover{border-color:var(--accent)}.porta b{display:block;font-family:var(--f-display);font-size:20px}.porta small{color:var(--muted);font-size:14px}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:18px}
.qrsvg{width:min(260px,70vw);background:#fff;padding:6px;border-radius:6px}.qrsvg svg{display:block;width:100%;height:auto}
@media print{ body *{visibility:hidden!important} #qrprint,#qrprint *{visibility:visible!important} #qrprint{position:fixed;left:0;top:0;width:100%;border:0;color:#000} dialog::backdrop{background:none} }
@media (max-width:860px){ .side-foot{flex-direction:row;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px} .chklist{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark">F2</div><div><b>F2 Conect</b><small>Painel F2 · interno</small></div></div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main" id="main">
    <div class="head"><div><h1>Carregando…</h1><p class="sub">Conectando ao F2 Conect.</p></div></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<div id="toast" hidden></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ===================== estado e utilidades ===================== */
const S = { db:null, user:null, assets:null, downloads:null, uid:null, data:{}, config:null, loaded:new Set(), route:{view:'painel'}, ui:{mes:null, vtab:'resumo'}, names:{}, ro:false };
const COLS = ['clientes','condutores','veiculos','contratos','usos','leituras','manutencoes','chamados','reembolsos','multas','documentos','pacotes','faturas','lancamentos','vistorias','abastecimentos','veiculos_fin'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const z = n => String(n).padStart(2,'0');
const isoD = d => d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const hoje = () => isoD(new Date());
const agora = () => { const d=new Date(); return isoD(d)+'T'+z(d.getHours())+':'+z(d.getMinutes()); };
const locISO = s => s ? new Date(s).toLocaleString('sv-SE').replace(' ','T').slice(0,16) : '';
const mesAtual = () => hoje().slice(0,7);
const addDias = (iso,n) => { const d=new Date(iso.slice(0,10)+'T12:00'); d.setDate(d.getDate()+n); return isoD(d); };
const diff = (a,b) => Math.round((new Date(b.slice(0,10)+'T12:00') - new Date(a.slice(0,10)+'T12:00'))/864e5);
const money = v => (v==null||v===''||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const kmf = v => (v==null||v===''||isNaN(v)) ? '—' : Math.round(v).toLocaleString('pt-BR')+' km';
const nf = (v,d=0) => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const dbr = s => s ? s.slice(0,10).split('-').reverse().join('/') : '—';
const dtbr = s => s ? dbr(s)+(s.length>10?' '+s.slice(11,16):'') : '—';
const mesbr = s => { if(!s) return '—'; const [y,m]=s.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]+'/'+y; };

const CONF = window.F2_CONFIG || {};
const Supa = { sb:null, chan:null, estado:'ok', caiu:false, ultimaCarga:0 };
const Store = { docs:{}, ver:0, subs:new Set(), t:null,
  notify(){ this.ver++; clearTimeout(this.t); this.t=setTimeout(()=>{ for(const f of [...this.subs]) try{ f(); }catch(e){ console.error(e); } },20); },
  async put(path,data){
    const i=path.indexOf('/'); const col=path.slice(0,i), id=path.slice(i+1);
    if(col==='locks') return;
    const cid=clienteDe(col,data,id); const existe=!!this.docs[path];
    const row={colecao:col,id,dados:data,cliente_id:cid,atualizado_em:new Date().toISOString(),atualizado_por:S.uid};
    setSync('salvando');
    let r;
    if(existe){ r=await Supa.sb.from('registros').update(row).eq('colecao',col).eq('id',id).select('id');
      if(!r.error && !(r.data||[]).length){ setSync('ok'); throw 'Sem permissão para alterar este registro no seu perfil.'; } }
    else r=await Supa.sb.from('registros').insert(row);
    if(r.error){ setSync('erro'); throw erroSupa(r.error); }
    this.docs[path]={d:data,cid}; setSync('ok'); this.notify();
  },
  aplicar(p){ if(p.eventType==='DELETE'){ const o=p.old||{}; delete this.docs[o.colecao+'/'+o.id]; } else { const n=p.new; if(!n||!n.colecao) return; this.docs[n.colecao+'/'+n.id]={d:n.dados,cid:n.cliente_id}; } this.notify(); }
};
function erroSupa(e){ const m=(e&&e.message)||String(e||''); if(/uso_aberto_unico|duplicate key/i.test(m)) return 'Outro check-in acabou de ser registrado neste veículo. Atualize a tela e tente de novo.'; if(/row-level security|permission|not authorized|Unauthorized/i.test(m)) return 'Sem permissão para esta ação no seu perfil.'; if(/Failed to fetch|NetworkError|fetch/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.'; return m||'Erro ao gravar no servidor.'; }
function setSync(st){ Supa.estado=st; document.querySelectorAll('.sync').forEach(el=>{ el.textContent={ok:'Sincronizado',salvando:'Salvando…',erro:'Erro ao salvar',off:'Reconectando…'}[st]||st; el.className='sync s-'+st; }); }

/* Define a qual cliente o registro pertence: é isso que o banco usa para isolar os dados de cada cliente. */
function clienteDe(col,d,id){
  d=d||{};
  if(col==='auditoria') return S.me && S.me.clienteId ? S.me.clienteId : null;
  if(['lancamentos','config','locks','veiculos_fin'].includes(col)) return null;
  if(S.me && ['gestor','condutor'].includes(S.me.perfil)) return S.me.clienteId;
  if(col==='clientes') return id;
  if(col==='veiculos'){ const c=contratoDoVeiculo(id); return c?c.clienteId:null; }
  if(d.clienteId) return d.clienteId;
  if(d.contratoId){ const c=G('contratos',d.contratoId); if(c) return c.clienteId; }
  if(d.veiculoId){ const ref=String(d.data||d.dataHora||d.inicio||d.competencia||hoje()).slice(0,10); const c=contratoDoVeiculo(d.veiculoId,ref)||contratoDoVeiculo(d.veiculoId); return c?c.clienteId:null; }
  return null;
}
async function comprimir(file){
  if(!file || !/^image\/(jpeg|png|webp)$/.test(file.type||'') || file.size<450*1024) return file;
  try{ const bmp=await createImageBitmap(file); const M=1600; const k=Math.min(1,M/Math.max(bmp.width,bmp.height)); const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height); const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82)); if(!blob||blob.size>=file.size) return file;
    return new File([blob],(file.name||'foto').replace(/\.[a-z0-9]{1,5}$/i,'')+'.jpg',{type:'image/jpeg'}); }catch(e){ return file; } }

    const {error}=await Supa.sb.storage.from('anexos').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false}); if(error) throw erroSupa(error); return {id:path}; },

};

/* ===================== regras de negócio ===================== */
function contratoAtivo(c, ref){ ref=ref||hoje(); return c && !c.excluido && c.status!=='encerrado' && c.inicio && c.inicio<=ref && (!c.fim || c.fim>=ref); }
function contratoDoVeiculo(vid, ref){ return L('contratos').filter(c=>c.veiculoId===vid && contratoAtivo(c,ref)).sort((a,b)=>a.inicio<b.inicio?1:-1)[0] || null; }
function statusVeiculo(v){ if(v.statusManual) return v.statusManual; return contratoDoVeiculo(v.id) ? 'alugado' : 'disponivel'; }
function statusPill(v){ const s=statusVeiculo(v); return `<span class="pill ${VSTATUS_P[s]||''}">${VSTATUS[s]||s}</span>`; }
function leiturasV(vid){ return L('leituras').filter(l=>l.veiculoId===vid && !l.suspeita).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0); }
function kmAtual(v){ const ls=leiturasV(v.id); const m = ls.length ? Math.max(...ls.map(l=>+l.km||0)) : 0; return Math.max(m, +v.kmInicial||0); }
function usoAberto(vid){ return L('usos').find(u=>u.veiculoId===vid && u.status==='em_uso') || null; }

function periodoFranquia(c, refISO){
  const ref=refISO||hoje();
  if(c.periodicidade==='total') return {ini:c.inicio, fim:c.fim||addDias(c.inicio,365)};
  const y=+ref.slice(0,4), m=+ref.slice(5,7);
  let ini=`${y}-${z(m)}-01`, fim=isoD(new Date(y,m,0));
  if(c.inicio>ini) ini=c.inicio; if(c.fim && c.fim<fim) fim=c.fim;
  return {ini,fim};
}
function kmBase(c, ini, soVerif){
  const ls=leiturasV(c.veiculoId).filter(l=>l.data.slice(0,10)<ini && l.data.slice(0,10)>=c.inicio && (!soVerif||l.status==='verificada'));
  return ls.length ? +ls[ls.length-1].km : (+c.kmInicial||0);
}
function pacotesPeriodo(c,p){ return L('pacotes').filter(k=>k.contratoId===c.id && ['aprovado','faturado'].includes(k.status) && (k.aprovadoEm||'').slice(0,10)>=p.ini && (k.aprovadoEm||'').slice(0,10)<=p.fim); }
function consumo(c, refISO){
  if(!c) return null;
  const P=cfg(); const p=periodoFranquia(c,refISO); const ref=refISO||hoje();
  const ls=leiturasV(c.veiculoId).filter(l=>{const d=l.data.slice(0,10); return d>=p.ini && d<=p.fim;});
  const base=kmBase(c,p.ini,false); const est=ls.length? Math.max(0, Math.max(...ls.map(l=>+l.km))-base) : 0;
  const lv=ls.filter(l=>l.status==='verificada'); const baseV=kmBase(c,p.ini,true); const conf=lv.length? Math.max(0, Math.max(...lv.map(l=>+l.km))-baseV) : 0;
  const pacs=pacotesPeriodo(c,p); const pacKm=pacs.reduce((s,k)=>s+(+k.km||0),0);
  const semLimite = !c.kmContratado;
  const limite = semLimite ? null : (+c.kmContratado + pacKm);
  const pct = limite ? est/limite*100 : null;
  // projeção pelo ritmo dos últimos N dias
  const desde=addDias(ref,-P.diasProjecao);
  const rec=leiturasV(c.veiculoId).filter(l=>l.data.slice(0,10)>=desde && l.data.slice(0,10)<=ref);
  let ritmo=null; if(rec.length>=2){ const a=rec[0], b=rec[rec.length-1]; const dd=Math.max(1,diff(a.data,b.data)); ritmo=(b.km-a.km)/dd; }
  const restantes=Math.max(0,diff(ref,p.fim)); const projFim = ritmo!=null ? est + ritmo*restantes : null;
  const excProj = (limite!=null && projFim!=null) ? Math.max(0, projFim-limite) : null;
  let dataEsgota=null; if(limite!=null && ritmo>0){ const falta=limite-est; dataEsgota = falta<=0 ? ref : addDias(ref, Math.ceil(falta/ritmo)); }
  return {p, est, conf, pacKm, limite, pct, saldo: limite!=null? limite-est : null, ritmo, projFim, excProj, custoExcProj: excProj!=null? excProj*(+c.valorKmExcedente||0) : null, dataEsgota, semLimite};
}
function kmBarHTML(c){

function alertas(){
  const A=[]; const P=cfg(); const h=hoje(); const now=agora();
  const add=(sev,titulo,detalhe,go)=>A.push({sev,titulo,detalhe,go});
  for(const c of L('contratos').filter(c=>contratoAtivo(c))){
    const v=G('veiculos',c.veiculoId); const pl=v?(v.placa||'').toUpperCase():'?';
    if(c.fim){ const d=diff(h,c.fim); if(d<=P.diasAvisoVenc) add(d<=7?'b':'w',`Contrato de ${pl} vence em ${d} dia${d===1?'':'s'}`,`${nomeCliente(c.clienteId)} · término ${dbr(c.fim)}`,{view:'veiculo',id:c.veiculoId,tab:'contrato'}); }
    const k=consumo(c);
    if(k && !k.semLimite){
      const lim=[...P.alertasKm].sort((a,b)=>b-a).find(t=>k.pct>=t);
      if(lim!=null) add(k.pct>=100?'b':'w',`${pl} usou ${nf(k.pct)}% da franquia de km`,`${nf(k.est)} de ${nf(k.limite)} km · saldo ${kmf(k.saldo)} · oferecer pacote adicional`,{view:'veiculo',id:c.veiculoId,tab:'km'});
      else if(k.excProj>0) add('w',`${pl}: previsão de estourar a franquia`,`Excedente previsto ${kmf(k.excProj)} (${money(k.custoExcProj)}) até ${dbr(k.p.fim)} · estimativa`,{view:'veiculo',id:c.veiculoId,tab:'km'});
    }
  }
  // documentos: último de cada tipo por veículo
  const ult={}; for(const d of L('documentos').filter(d=>d.vencimento)){ const key=d.veiculoId+'|'+d.tipo; if(!ult[key]||ult[key].vencimento<d.vencimento) ult[key]=d; }
  for(const d of Object.values(ult)){ const v=G('veiculos',d.veiculoId); if(!v||statusVeiculo(v)==='vendido') continue; const dd=diff(h,d.vencimento); if(dd<=P.diasAvisoVenc) add(dd<0?'b':'w',`${lbl(DOC_T,d.tipo)} de ${(v.placa||'').toUpperCase()} ${dd<0?'vencido há '+(-dd)+' dias':'vence em '+dd+' dias'}`,`Vencimento ${dbr(d.vencimento)}`,{view:'veiculo',id:d.veiculoId,tab:'docs'}); }
  for(const u of L('usos')){
    const v=G('veiculos',u.veiculoId); const pl=v?(v.placa||'').toUpperCase():'?';
    if(u.status==='em_uso'){ const hrs=(new Date(now)-new Date(u.inicio))/36e5; if(hrs>P.horasCheckin) add('w',`Check-in aberto há ${Math.floor(hrs)} h em ${pl}`,`${nomeCondutor(u)} · desde ${dtbr(u.inicio)}`,{view:'uso'}); }
    if(u.kmSemCondutor>0 && !u.gapResolvido) add('w',`${pl}: ${kmf(u.kmSemCondutor)} rodados sem condutor registrado`,`Detectado no check-in de ${dtbr(u.inicio)}`,{view:'uso'});
  }
  for(const c of L('chamados').filter(c=>!['resolvido','encerrado'].includes(c.status))) add(c.prioridade==='alta'||c.tipo==='emergencia'||c.tipo==='sinistro'?'b':'i',`Chamado #${c.numero} aberto · ${lbl(CH_TIPO,c.tipo)}`,`${(G('veiculos',c.veiculoId)||{}).placa||''} · ${lbl(CH_ST,c.status)}`,{view:'manut'});
  for(const r of L('reembolsos').filter(r=>['solicitado','aguardando','aprovado'].includes(r.status))) add('i',`Reembolso ${r.status==='aprovado'?'aprovado, aguardando pagamento':'pendente de aprovação'}`,`${money(r.valor)} · ${r.motivo||''}`,{view:'reemb'});
  for(const f of L('faturas').filter(f=>f.status==='aberta' && f.vencimento && f.vencimento<h)) add('b',`Fatura em atraso · ${mesbr(f.competencia)}`,`${money(f.total)} · venceu ${dbr(f.vencimento)}`,{view:'faturas'});
  for(const m of L('multas').filter(m=>m.statusIndicacao!=='indicado' && m.prazoIndicacao)){ const dd=diff(h,m.prazoIndicacao); if(dd<=P.diasAvisoMulta) add(dd<0?'b':'w',`Prazo de indicação de condutor ${dd<0?'vencido':'em '+dd+' dias'}`,`Auto ${m.auto||'—'} · ${(G('veiculos',m.veiculoId)||{}).placa||''}`,{view:'multas'}); }
  for(const m of L('manutencoes').filter(m=>m.arcaCom==='apuracao' && m.status!=='cancelada')) add('w',`Mau uso em apuração`,`${catLbl(m.categoria)} · ${(G('veiculos',m.veiculoId)||{}).placa||''} · decidir responsabilidade`,{view:'manut'});
  // preventiva do cliente vencida
  for(const v of L('veiculos').filter(v=>statusVeiculo(v)!=='vendido')){
    for(const p of preventivas(v).filter(p=>p.st==='vencida')) add('w',`${p.nome} vencida em ${(v.placa||'').toUpperCase()}`,`${p.pk!=null?'Previsto '+kmf(p.pk)+' · atual '+kmf(kmAtual(v)):''}${p.pd?' · prazo '+dbr(p.pd):''} · sem comprovante novo`,{view:'veiculo',id:v.id,tab:'manut'});
  }
  for(const x of L('vistorias').filter(x=>x.status==='enviada')){ const n=Object.keys(x.checklist||{}).length; add(n||x.avarias?'w':'i',`Vistoria do condutor ${n||x.avarias?'com avarias':'para revisar'}`,`${((G('veiculos',x.veiculoId)||{}).placa||'').toUpperCase()} · ${x.condutorNome||''} · ${dtbr(x.data)}`,{view:'vistorias'}); }
  for(const x of L('vistorias').filter(x=>x.status==='contestada')) add('w','Vistoria contestada pelo cliente',`${((G('veiculos',x.veiculoId)||{}).placa||'').toUpperCase()} · ${x.contestacao||''}`,{view:'vistorias'});
  for(const k of L('pacotes').filter(k=>k.status==='solicitado')) add('i','Pedido de pacote de km',`${nf(k.km)} km por ${money(k.preco)} · aprove em Contratos`,{view:'contratos'});
  if(S.me && S.me.perfil==='admin'){ const n=(S.perfis||[]).filter(p=>p.perfil==='pendente'||!p.ativo).length; if(n) add('i',`${n} usuário(s) aguardando liberação`,'Defina perfil e ative em Configurações → Usuários',{view:'config'}); }
  const o={b:0,w:1,i:2}; return A.sort((a,b)=>o[a.sev]-o[b.sev]);
}

/* ===================== gravação, auditoria, lançamentos ===================== */
function limpa(o){ return JSON.parse(JSON.stringify(o, (k,v)=> v===undefined ? null : v)); }
async function audit(acao,col,id,resumo){ try{ await S.db.collection('auditoria').add({ts:new Date().toISOString(), uid:S.uid, acao, col, refId:id, resumo:resumo||''}); }catch(e){ console.warn('auditoria',e); } }
async function salvar(col,id,dados,acao,resumo){
  const ref = id ? S.db.collection(col).doc(id) : S.db.collection(col).doc();
  const antes = id ? G(col,id) : null;
  const body = {...(antes||{}), ...dados, atualizadoEm:new Date().toISOString(), atualizadoPor:S.uid};
  if(!antes){ body.criadoEm=new Date().toISOString(); body.criadoPor=S.uid; }
  delete body.id;
  if(col==='veiculos'){ const fin={}, pub={}; for(const [k,x] of Object.entries(body)) (FIN_V(k)?fin:pub)[k]=x;
    if(Object.keys(fin).length) await S.db.collection('veiculos_fin').doc(ref.id).set(limpa(fin)); await ref.set(limpa(pub)); }
  else await ref.set(limpa(body));
  audit(acao || (antes?'editou':'criou'), col, ref.id, resumo || refLabel(col,{...body,id:ref.id}));
  return ref.id;
}
async function excluirLogico(col,id,motivo){ await salvar(col,id,{excluido:true, excluidoEm:new Date().toISOString(), excluidoPor:S.uid, motivoExclusao:motivo||''},'excluiu'); }
/* Lançamentos derivados de um registro de origem: se mudaram, estorna os antigos e cria os novos (nunca edita). */
async function syncLanc(origemCol, origemId, desejados){
  const ativos=L('lancamentos').filter(l=>l.origemId===origemId && !l.estornado && !l.estornoDe);
  const sig=a=>a.map(l=>[l.tipo,l.categoria,r2(+l.valor),l.veiculoId||'',l.competencia].join('|')).sort().join(';');
  if(sig(ativos)===sig(desejados)) return;
  for(const l of ativos){
    await salvar('lancamentos',null,{...l, id:undefined, valor:-(+l.valor), estornoDe:l.id, descricao:'Estorno: '+(l.descricao||''), estornado:false, criadoEm:undefined},'estornou');
    await salvar('lancamentos',l.id,{estornado:true},'marcou estornado');
  }
  for(const d of desejados) await salvar('lancamentos',null,{...d, origemCol, origemId},'lançou');
}

/* ===================== formulário genérico ===================== */
function fieldHTML(f, val){
  if(f.sec) return `<div class="sec" data-show="${f.show?'1':''}">${esc(f.sec)}</div>`;
  const id='f_'+f.k; const req=f.req?' <span class="req">*</span>':''; const cls=f.full?' full':'';
  const hint=f.hint?`<span class="hint">${esc(f.hint)}</span>`:'';
  let inp='';
  const v = val==null ? '' : val;
  switch(f.t){
    case 'num': case 'money': inp=`<input id="${id}" name="${f.k}" type="number" step="${f.step||(f.t==='money'?'0.01':'1')}" inputmode="decimal" value="${esc(v)}"${f.req?' required':''}>`; break;
    case 'date': inp=`<input id="${id}" name="${f.k}" type="date" value="${esc(String(v).slice(0,10))}"${f.req?' required':''}>`; break;
    case 'dt': inp=`<input id="${id}" name="${f.k}" type="datetime-local" value="${esc(String(v).slice(0,16))}"${f.req?' required':''}>`; break;
    case 'month': inp=`<input id="${id}" name="${f.k}" type="month" value="${esc(v)}"${f.req?' required':''}>`; break;
    case 'area': inp=`<textarea id="${id}" name="${f.k}"${f.req?' required':''}>${esc(v)}</textarea>`; break;
    case 'bool': return `<div class="fld chk${cls}" data-k="${f.k}"><input id="${id}" name="${f.k}" type="checkbox"${v?' checked':''}><label for="${id}">${esc(f.l)}</label></div>`;
    case 'sel': inp=`<select id="${id}" name="${f.k}"${f.req?' required':''}>${f.req?'':'<option value=""></option>'}${f.opts.map(o=>`<option value="${esc(o.v)}"${String(o.v)===String(v)?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`; break;
    case 'ref': { const items=L(f.ref).filter(d=>!f.filter||f.filter(d)||d.id===v); inp=`<select id="${id}" name="${f.k}"${f.req?' required':''}><option value="">${items.length?'Selecione…':'Nenhum cadastrado'}</option>${items.map(d=>`<option value="${esc(d.id)}"${d.id===v?' selected':''}>${esc(refLabel(f.ref,d))}</option>`).join('')}</select>`; break; }
    case 'plano': { const ps=cfg().planos||[]; inp=`<select id="${id}" name="${f.k}"><option value="">${ps.length?'Sem modelo':'Nenhum modelo cadastrado em Configurações'}</option>${ps.map((p,i)=>`<option value="${i}">${esc(p.nome||(p.prazo+' meses · '+p.km+' km/mês'))} — ${money(p.aluguel)}</option>`).join('')}</select>`; break; }
    case 'file': { const cur=v?`<button type="button" class="btn ghost sm" data-file="${esc(v)}">Ver arquivo atual</button>`:''; inp=`<input id="${id}" name="${f.k}" type="file" accept="${esc(f.accept||'')}">${cur}`; break; }
    case 'files': { const cur=Array.isArray(v)&&v.length?`<span class="hint">${arqs(v)}</span>`:''; inp=`<input id="${id}" name="${f.k}" type="file" multiple accept="${esc(f.accept||'')}">${cur}`; break; }
    case 'hidden': return `<input type="hidden" id="${id}" name="${f.k}" value="${esc(v)}">`;
    case 'checklist': { const val=v||{}; return `<div class="fld full" data-k="${f.k}"><label>${esc(f.l)}</label><div class="chklist">${f.opts.map((o,i)=>`<label for="${id}_${i}"><input type="checkbox" id="${id}_${i}" data-ck="${esc(o)}"${val[o]?' checked':''}> ${esc(o)}</label>`).join('')}</div></div>`; }
    default: inp=`<input id="${id}" name="${f.k}" type="text" value="${esc(v)}"${f.req?' required':''}>`;
  }
  return `<div class="fld${cls}" data-k="${f.k}"><label for="${id}">${esc(f.l)}${req}</label>${inp}${hint}</div>`;
}
function lerForm(form, sc){
  const v={};
  for(const f of sc.fields){ if(f.sec||f.t==='file'||f.t==='files') continue;
    if(f.t==='checklist'){ const o={}; form.querySelectorAll(`.fld[data-k="${f.k}"] [data-ck]`).forEach(c=>{ if(c.checked) o[c.dataset.ck]=true; }); v[f.k]=o; continue; }
    const el=form.querySelector('#f_'+f.k); if(!el) continue;
    if(f.t==='bool') v[f.k]=el.checked; else if(f.t==='num'||f.t==='money') v[f.k]= el.value===''?null:+el.value; else v[f.k]=el.value; }
  return v;
}
function aplicarShow(form, sc){
  const v=lerForm(form,sc);
  sc.fields.forEach((f,i)=>{ if(!f.show) return; const el = f.sec ? form.querySelectorAll('.sec')[sc.fields.filter(x=>x.sec).indexOf(f)] : form.querySelector(`.fld[data-k="${f.k}"]`); if(el) el.hidden=!f.show(v); });
}
function openForm(key, id, preset){
  const sc=SCHEMA[key]; const cur=id?G(sc.col,id):null; const vals={};
  for(const f of sc.fields){ if(f.sec) continue; if(f.def!=null) vals[f.k]=f.def; if(f.defFn) vals[f.k]=f.defFn(); }
  Object.assign(vals, cur||{}, preset||{});
  if(key==='contratos' && cur && cur.pacotesOferta) vals.pacotesTxt=cur.pacotesOferta.map(p=>p.km+'='+p.preco).join(', ');
  const dlg=$('#dlg');
  dlg.innerHTML=`<form id="frm" novalidate><div class="dh"><h2>${sc.fixo||key==='vendas'?'':cur?'Editar ':'Novo · '}${esc(sc.titulo)}</h2><button type="button" class="btn ghost" data-close>Fechar</button></div>
    <div class="dc"><div class="fgrid">${sc.fields.map(f=>fieldHTML(f,vals[f.k])).join('')}</div><p class="hint muted" id="ferr" hidden></p></div>
    <div class="df">${cur&&ehEquipe()&&!['vendas'].includes(key)&&!cur.excluido?`<button type="button" class="btn danger" data-del style="margin-right:auto">Excluir</button>`:''}<button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri" id="fsub">Salvar</button></div></form>`;
  const form=$('#frm');
  aplicarShow(form,sc);
  form.addEventListener('change',e=>{ const k=e.target.name; const f=sc.fields.find(x=>x.k===k); if(f&&f.onChange) f.onChange(form,e.target.value);
    if(k==='plano' && e.target.value!==''){ const p=cfg().planos[+e.target.value]; if(p){ const set=(n,x)=>{const el=form.querySelector('#f_'+n); if(el&&x!=null) el.value=x;}; set('prazoMeses',p.prazo); set('kmContratado',p.km); set('aluguel',p.aluguel); set('valorKmExcedente',p.kmExc); set('pacotesTxt',p.pacotes); set('periodicidade','mensal'); } }
    aplicarShow(form,sc); });
  form.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dlg.close());
  const del=form.querySelector('[data-del]'); if(del) del.onclick=async()=>{ const motivo=await perguntar('Excluir este registro?','Ele sai das listas, mas fica guardado no histórico e na auditoria. Informe o motivo:','Excluir',true); if(motivo===null) return; try{ await excluirLogico(sc.col,id,motivo); if(sc.col==='manutencoes'||sc.col==='documentos'||sc.col==='reembolsos') await syncLanc(sc.col,id,[]); dlg.close(); toast('Registro excluído.'); }catch(e){ toast(errMsg(e)); } };
  form.addEventListener('submit', async e=>{
    e.preventDefault(); const err=$('#ferr'); err.hidden=true;
    if(S.preview){ err.textContent='Modo visualização: nada é gravado.'; err.hidden=false; return; }
    const v=lerForm(form,sc);
    const falta=sc.fields.filter(f=>f.req && !f.sec && !(f.show && !f.show(v)) && (f.t==='file' ? !(cur&&cur[f.k]) && !(form.querySelector('#f_'+f.k)||{}).files?.length : f.t!=='files' && f.t!=='checklist' && (v[f.k]===''||v[f.k]==null)));
    if(falta.length){ err.textContent='Preencha: '+falta.map(f=>f.l).join(', ')+'.'; err.hidden=false; err.style.color='var(--danger)'; return; }
    delete v.plano;
    const sub=$('#fsub'); sub.disabled=true; sub.textContent='Salvando…';
    try{
      let cidUp=clienteDe(sc.col,{...(cur||{}),...v},id); if(!cidUp && ehCliente()) cidUp=S.me.clienteId;
      for(const f of sc.fields.filter(f=>f.t==='file'||f.t==='files')){ const el=form.querySelector('#f_'+f.k); if(!el||!el.files||!el.files.length) continue;
        if(f.t==='file'){ sub.textContent='Enviando arquivo…'; const r=await S.assets.upload(el.files[0],cidUp); v[f.k]=r.id; v[f.k+'Nome']=el.files[0].name; }
        else { const arr=((cur&&cur[f.k])||[]).slice(); let n=0; for(const fl of el.files){ sub.textContent=`Enviando ${++n}/${el.files.length}…`; const r=await S.assets.upload(fl,cidUp); arr.push({id:r.id,nome:fl.name}); } v[f.k]=arr; } }
      sub.textContent='Salvando…';
      if(sc.save) await sc.save(v,id,cur); else await salvar(sc.col,id,v);
      dlg.close(); toast('Salvo.');
    }catch(ex){ err.textContent=errMsg(ex); err.style.color='var(--danger)'; err.hidden=false; sub.disabled=false; sub.textContent='Salvar'; }
  });
  if(dlg.open) dlg.close(); dlg.showModal();
}
function perguntar(titulo, texto, ok, comCampo){
  return new Promise(res=>{ const d=$('#ask'); let feito=false; const fim=v=>{ if(feito) return; feito=true; res(v); };
    const campo = comCampo==='date' ? `<div class="fld"><input id="askv" type="date" value="${hoje()}"></div>` : comCampo ? '<div class="fld"><textarea id="askv" placeholder="Motivo ou justificativa"></textarea></div>' : '';
    d.innerHTML=`<form class="dbody" id="askf"><div class="dh"><h2>${esc(titulo)}</h2></div><div class="dc"><p style="margin:0 0 10px">${texto}</p>${campo}</div><div class="df"><button type="button" class="btn" id="askn">Voltar</button><button type="submit" class="btn pri">${esc(ok)}</button></div></form>`;
    d.querySelector('#askn').onclick=()=>{ fim(null); d.close(); };

    <div class="fld full"><label for="rt_j">Justificativa <span class="req">*</span></label><textarea id="rt_j"></textarea></div></div><p class="hint" id="ferr" hidden style="color:var(--danger)"></p></div>
    <div class="df"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri" id="fsub">Registrar</button></div></form>`;

    if(sob) return erro(`Conflita com o uso de ${nomeCondutor(sob)} (${dtbr(sob.inicio)} a ${dtbr(sob.fim)}).`);
    const apos=L('multas').some(m=>m.veiculoId===v && m.dataHora>=ini && m.dataHora<=fim) || L('chamados').some(c=>c.veiculoId===v && c.tipo==='sinistro' && locISO(c.criadoEm)>=ini && locISO(c.criadoEm)<=fim);
    const cond=L('condutores').find(d=>d.nome.toLowerCase()===nome.toLowerCase());
    $('#fsub').disabled=true;
    try{ const c=contratoDoVeiculo(v, ini.slice(0,10));
      const uid=await salvar('usos',null,{veiculoId:v,contratoId:c?c.id:null,clienteId:c?c.clienteId:null,condutorId:cond?cond.id:null,condutorNome:cond?cond.nome:nome,inicio:ini,fim,kmInicial:ki?+ki:null,kmFinal:kf?+kf:null,status:'encerrado',retroativo:true,justificativa:j,registradoAposEvento:apos,kmSemCondutor:0},'registrou uso retroativo');
      if(kf) await salvar('leituras',null,{veiculoId:v,km:+kf,data:fim,origem:'retroativo',status:'informada',origemId:uid},'registrou km');
      dlg.close(); toast(apos?'Registrado. Marcado como "registrado após o evento" para avaliação.':'Uso retroativo registrado.'); }catch(ex){ erro(errMsg(ex)); $('#fsub').disabled=false; } };

}

/* ===================== faturas ===================== */
function propostaFatura(c, comp){
  const P=cfg(); const [y,m]=comp.split('-').map(Number); const ini=`${y}-${z(m)}-01`, fim=isoD(new Date(y,m,0)); const dias=new Date(y,m,0).getDate();
  const itens=[], avisos=[]; let bloqueado=false; const v=G('veiculos',c.veiculoId)||{};
  if(c.inicio>fim || (c.fim && c.fim<ini)) avisos.push('O contrato não está vigente nesta competência.');
  if(c.inicio>ini || (c.fim && c.fim<fim)) avisos.push('Mês parcial de contrato: o aluguel está cheio. Faça ajuste manual se for o caso.');
  itens.push({tipo:'aluguel',natureza:'receita',desc:`Aluguel ${mesbr(comp)} · ${(v.placa||'').toUpperCase()}`,valor:+c.aluguel||0});
  // desconto por dias parados em manutenção de responsabilidade da F2
  const carencia=+c.carencia||0;
  for(const mt of L('manutencoes').filter(x=>x.veiculoId===c.veiculoId && x.arcaCom==='f2' && x.entradaOficina && x.status!=='cancelada')){
    const totalParado = diff(mt.entradaOficina, mt.liberacao||hoje()); if(totalParado<=carencia) continue;
    const a = mt.entradaOficina>ini?mt.entradaOficina:ini;
    const ultDia = mt.liberacao ? addDias(mt.liberacao,-1) : hoje(); const b = ultDia<fim?ultDia:fim;
    if(b<a) continue; let d=diff(a,b)+1; if(mt.entradaOficina>=ini) d=Math.max(0,d-carencia);
    if(d>0) itens.push({tipo:'desconto',natureza:'receita',desc:`Desconto: ${d} dia(s) parado em manutenção (${catLbl(mt.categoria)})`,valor:-r2((+c.aluguel||0)/dias*d),refCol:'manutencoes',refId:mt.id});
  }
  for(const k of L('pacotes').filter(k=>k.contratoId===c.id && k.status==='aprovado' && !k.faturaId && (k.aprovadoEm||'').slice(0,10)<=fim)) itens.push({tipo:'pacote',natureza:'receita',desc:`Pacote adicional de ${nf(k.km)} km`,valor:+k.preco,refCol:'pacotes',refId:k.id});
  // excedente confirmado, quando o período fecha nesta competência
  const fechaAqui = c.periodicidade==='total' ? (c.fim && c.fim>=ini && c.fim<=fim) : true;
  if(c.kmContratado && fechaAqui){
    if(fim>=hoje()) avisos.push('O período de km ainda não fechou: o excedente só é calculado depois do fim do período.');
    else { const k=consumo(c,fim);
      const lvFim=leiturasV(c.veiculoId).filter(l=>l.status==='verificada' && l.data.slice(0,10)<=fim && l.data.slice(0,10)>=addDias(fim,-3));
      const gaps=L('usos').some(u=>u.veiculoId===c.veiculoId && u.kmSemCondutor>0 && !u.gapResolvido && u.inicio.slice(0,10)>=k.p.ini && u.inicio.slice(0,10)<=k.p.fim);
      const susp=L('leituras').some(l=>l.veiculoId===c.veiculoId && l.suspeita && !l.excluido && l.data.slice(0,10)>=k.p.ini && l.data.slice(0,10)<=k.p.fim);
      if(!lvFim.length || gaps || susp){ bloqueado=true; avisos.push(`Excedente bloqueado: ${!lvFim.length?'falta leitura verificada no fim do período':''}${gaps?' · há km sem condutor registrado':''}${susp?' · há leitura suspeita':''}. Resolva antes de emitir.`); }
      else { const exc=Math.max(0,k.conf-k.limite); if(exc>0) itens.push({tipo:'excedente',natureza:'receita',desc:`Km excedente: ${nf(exc)} km × ${money(c.valorKmExcedente)}`,valor:r2(exc*(+c.valorKmExcedente||0))}); }
    }
  }
  for(const mu of L('multas').filter(x=>x.veiculoId===c.veiculoId && x.statusRepasse==='a_repassar' && +x.valor>0 && x.dataHora.slice(0,10)>=c.inicio && x.dataHora.slice(0,10)<=fim)) itens.push({tipo:'multa',natureza:'repasse',desc:`Repasse de multa ${mu.auto||''} (${dbr(mu.dataHora)})`,valor:+mu.valor,refCol:'multas',refId:mu.id});
  for(const mt of L('manutencoes').filter(x=>x.veiculoId===c.veiculoId && x.arcaCom==='mau_uso_fatura' && !x.faturaId && x.status!=='cancelada' && +x.valor>0 && (x.data||'')<=fim)) itens.push({tipo:'avaria',natureza:'receita',desc:`Avaria por mau uso: ${catLbl(mt.categoria)} (${dbr(mt.data)})`,valor:+mt.valor,refCol:'manutencoes',refId:mt.id});
  const dv=Math.min(+c.diaVenc||10, new Date(y,m+1,0).getDate()); const venc=isoD(new Date(y,m,dv));
  return {itens, avisos, bloqueado, vencimento:venc};
}

      <div class="tw"><table><thead><tr><th>Item</th><th>Natureza</th><th class="num">Valor</th></tr></thead><tbody>${itens.map(i=>`<tr><td>${esc(i.desc)}</td><td>${i.natureza==='repasse'?'<span class="tag">Repasse</span>':'Receita'}</td><td class="num">${money(i.valor)}</td></tr>`).join('')}<tr><td colspan="2"><b>Total</b></td><td class="num"><b>${money(total)}</b></td></tr></tbody></table></div>

    f.onsubmit=async e=>{ e.preventDefault(); if(!pr||existe) return; $('#fsub').disabled=true;

  const ps=(S.perfis||[]).slice().sort((a,b)=>(a.perfil==='pendente'?0:1)-(b.perfil==='pendente'?0:1)||String(a.nome).localeCompare(String(b.nome)));

function openPerfil(id){
  const p=(S.perfis||[]).find(x=>x.id===id); if(!p) return; const dlg=$('#dlg'); if(dlg.open) dlg.close();
  dlg.innerHTML=`<form id="frm"><div class="dh"><h2>Usuário · ${esc(p.nome||p.email)}</h2><button type="button" class="btn ghost" data-close>Fechar</button></div><div class="dc"><div class="fgrid">
    <div class="fld"><label for="pf_n">Nome</label><input id="pf_n" value="${esc(p.nome||'')}"></div><div class="fld"><label for="pf_e">E-mail</label><input id="pf_e" value="${esc(p.email||'')}" disabled></div>
    <div class="fld"><label for="pf_p">Perfil</label><select id="pf_p">${PERFIS.map(([v,l])=>`<option value="${v}"${p.perfil===v?' selected':''}>${l}</option>`).join('')}</select></div>
    <div class="fld"><label for="pf_c">Cliente</label><select id="pf_c"><option value="">—</option>${L('clientes').map(c=>`<option value="${esc(c.id)}"${p.cliente_id===c.id?' selected':''}>${esc(c.nome)}</option>`).join('')}</select><span class="hint">Obrigatório para gestor e condutor.</span></div>
    <div class="fld full"><label for="pf_d">Condutor vinculado</label><select id="pf_d"><option value="">Criar cadastro de condutor com o nome do usuário</option>${L('condutores').map(d=>`<option value="${esc(d.id)}"${p.condutor_id===d.id?' selected':''}>${esc(d.nome)} · ${esc(nomeCliente(d.clienteId))}${d.email&&d.email.toLowerCase()===String(p.email).toLowerCase()?' · mesmo e-mail':''}</option>`).join('')}</select><span class="hint">Só para o perfil condutor.</span></div>
    <div class="fld chk"><input id="pf_a" type="checkbox"${p.ativo?' checked':''}><label for="pf_a">Acesso ativo</label></div></div><p class="hint" id="ferr" hidden style="color:var(--danger)"></p></div>
    <div class="df"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" id="fsub">Salvar</button></div></form>`;
  const f=$('#frm'); f.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dlg.close());
  const sug=L('condutores').find(d=>d.email && d.email.toLowerCase()===String(p.email).toLowerCase()); if(sug && !p.condutor_id) f.querySelector('#pf_d').value=sug.id;
  f.onsubmit=async e=>{ e.preventDefault(); const err=$('#ferr'); const erro=m=>{ err.textContent=m; err.hidden=false; };
    const perfil=f.querySelector('#pf_p').value, cli=f.querySelector('#pf_c').value||null, ativo=f.querySelector('#pf_a').checked, nome=f.querySelector('#pf_n').value.trim(); let cond=f.querySelector('#pf_d').value||null;
    if(['gestor','condutor'].includes(perfil) && !cli) return erro('Escolha o cliente deste usuário.');
    if(p.perfil==='admin' && (perfil!=='admin'||!ativo) && S.perfis.filter(x=>x.perfil==='admin'&&x.ativo).length<=1) return erro('Precisa existir pelo menos um administrador ativo.');
    $('#fsub').disabled=true;
    try{ if(perfil==='condutor' && !cond) cond=await salvar('condutores',null,{clienteId:cli,nome:nome||p.email,email:p.email,status:'aprovado'},'criou condutor');
      const {error}=await Supa.sb.from('perfis').update({nome,perfil,cliente_id:['gestor','condutor'].includes(perfil)?cli:null,condutor_id:perfil==='condutor'?cond:null,ativo}).eq('id',id);
      if(error) throw erroSupa(error);
      audit('alterou usuário','perfis',id,`${nome} · ${lbl(PERFIS,perfil)}${ativo?'':' · inativo'}`); await carregarPerfis(); dlg.close(); toast('Usuário atualizado.'); render();
    }catch(ex){ erro(errMsg(ex)); $('#fsub').disabled=false; } };
  dlg.showModal();
}

function kmChart(ls){
  if(ls.length<2) return '';
  const W=720,H=180,pl=64,pr=14,pt=14,pb=28; const xs=ls.map(l=>new Date(l.data).getTime()), ys=ls.map(l=>+l.km);
  const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1, y0=Math.min(...ys), y1=Math.max(...ys);
  const span=Math.max(1,y1-y0); const X=t=>pl+(t-x0)/Math.max(1,x1-x0)*(W-pl-pr), Y=k=>H-pb-(k-y0)/span*(H-pt-pb);
  const pts=ls.map(l=>`${X(new Date(l.data).getTime()).toFixed(1)},${Y(+l.km).toFixed(1)}`).join(' ');
  const ticks=[y0,y0+span/2,y1];
  return `<div class="card"><h3>Evolução do odômetro</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução da quilometragem">
    ${ticks.map(k=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)"/><text x="${pl-8}" y="${Y(k)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf(k)}</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${ls.map(l=>`<circle cx="${X(new Date(l.data).getTime())}" cy="${Y(+l.km)}" r="3.5" fill="${l.status==='verificada'?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"><title>${dtbr(l.data)} · ${kmf(l.km)} · ${l.status}</title></circle>`).join('')}
    <text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)">${dbr(ls[0].data)}</text><text x="${W-pr}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${dbr(ls[ls.length-1].data)}</text></svg>
    <small class="muted">Ponto cheio = leitura verificada · ponto vazado = informada</small></div>`;
}

/* ---------- manutenção preventiva ---------- */
const PREV_ITENS=[['preventiva','Revisão','pvRevKm','pvRevMeses'],['oleo','Troca de óleo','pvOleoKm','pvOleoMeses'],['alinhamento','Alinhamento e balanceamento','pvAlinKm','pvAlinMeses']];
function preventivas(v){
  const P=cfg(); const pd0=P.prev||{}; const km=kmAtual(v); const h=hoje(); const out=[];
  for(const [cat,nome,kk,km_] of PREV_ITENS){
    const ik=+(v[kk]||pd0[kk]||0), im=+(v[km_]||pd0[km_]||0);
    const m=L('manutencoes').filter(x=>x.veiculoId===v.id&&x.categoria===cat&&!['cancelada','agendada'].includes(x.status)).sort((a,b)=>a.data<b.data?1:-1)[0];
    let pk=null, pd=null, base='ultimo';
    if(m){ pk = m.proximaKm ? +m.proximaKm : (ik && m.km ? +m.km+ik : null); pd = m.proximaData || (im && m.data ? addMeses(m.data,im) : null); }
    else if(ik||im){ base='cadastro'; pk = ik ? (+v.kmInicial||0)+ik : null; pd = im && v.aqData ? addMeses(v.aqData,im) : null; }
    if(pk==null && !pd) continue;
    const faltaKm = pk!=null ? pk-km : null, faltaD = pd ? diff(h,pd) : null;
    const st = ((faltaKm!=null&&faltaKm<=0)||(faltaD!=null&&faltaD<0)) ? 'vencida' : ((faltaKm!=null&&faltaKm<=(+P.prevAvisoKm||1000))||(faltaD!=null&&faltaD<=(+P.prevAvisoDias||30))) ? 'proxima' : 'ok';
    out.push({cat,nome,ult:m||null,pk,pd,faltaKm,faltaD,st,base});
  }
  return out;
}
const PREV_ST={ok:['p-ok','Em dia'],proxima:['p-warn','Próxima'],vencida:['p-bad','Vencida']};
function prevHTML(v, comBotao){
  const ps=preventivas(v);

    <small class="muted">Próxima: ${[p.pk!=null?kmf(p.pk)+(p.faltaKm!=null?(p.faltaKm>0?' (faltam '+kmf(p.faltaKm)+')':' (passou '+kmf(-p.faltaKm)+')'):''):'',p.pd?'até '+dbr(p.pd):''].filter(Boolean).join(' · ')}</small><br>

function consumoComb(vid){
  const fs=L('abastecimentos').filter(a=>a.veiculoId===vid && +a.km>0).sort((a,b)=>+a.km-+b.km); const kml={}; let ultCheio=null, litros=0, totKm=0, totL=0;
  for(const a of fs){ litros+=+a.litros||0; if(a.tanqueCheio){ if(ultCheio && +a.km>+ultCheio.km && litros>0){ kml[a.id]=(+a.km-+ultCheio.km)/litros; totKm+=+a.km-+ultCheio.km; totL+=litros; } ultCheio=a; litros=0; } }
  return {kml, media: totL? totKm/totL : null};
}

/* ---------- QR code do veículo ---------- */
function urlQR(vid){ return location.origin + '/motorista?v=' + encodeURIComponent(vid); }
let _qrLoad=null;
function carregarQR(){ if(window.qrcode) return Promise.resolve(); if(!_qrLoad) _qrLoad=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='/qrcode.js'; s.onload=()=>res(); s.onerror=()=>{ _qrLoad=null; rej('Não foi possível carregar o gerador de QR code. Verifique a internet.'); }; document.head.appendChild(s); }); return _qrLoad; }
async function openQR(vid){

  const q=qrcode(0,'M'); q.addData(url); q.make(); const svg=q.createSvgTag({cellSize:8,margin:2,scalable:true,alt:'QR code de check-in do veículo '+(v.placa||'')});
  const dlg=$('#dlg'); if(dlg.open) dlg.close();

    <div class="qrcard" id="qrprint"><div class="brand" style="padding:0;justify-content:center"><div class="brand-mark">F2</div><div style="text-align:left"><b>F2 Conect</b><small>F2 Carloc</small></div></div>
      <div style="display:flex;justify-content:center">${placaHTML(v,1)}</div><div class="qrsvg">${svg}</div>
      <b style="font-size:17px">Check-in e checkout</b><span>Aponte a câmera do celular para este código.</span><small class="muted mono" style="overflow-wrap:anywhere">${esc(url)}</small></div>
    <p class="muted" style="margin:0">Imprima, plastifique e cole em lugar visível dentro do carro (ex.: para-sol ou porta-luvas). Quem ainda não tem conta cria pelo próprio QR e o gestor libera.</p></div>
    <div class="df"><button type="button" class="btn" data-copiar>Copiar link</button><button type="button" class="btn pri" data-imprimir>Imprimir</button></div></div>`;
  dlg.querySelector('[data-close]').onclick=()=>dlg.close();
  dlg.querySelector('[data-imprimir]').onclick=()=>window.print();
  dlg.querySelector('[data-copiar]').onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast('Link copiado.'); }catch(e){ toast(url); } };
  dlg.showModal();

const QR_KEY='f2_qr';
function qrGuardar(v){ try{ localStorage.setItem(QR_KEY,JSON.stringify({v,ts:Date.now()})); }catch(e){} }
function qrPendente(){ try{ const o=JSON.parse(localStorage.getItem(QR_KEY)||'null'); return o && Date.now()-o.ts<6*36e5 ? o.v : null; }catch(e){ return null; } }
function qrLimpar(){ try{ localStorage.removeItem(QR_KEY); }catch(e){} }
(function(){ try{ const v=new URLSearchParams(location.search).get('v'); if(v){ qrGuardar(v); history.replaceState(null,'',location.pathname+location.hash); } }catch(e){} })();
function tratarQR(){
  const v=qrPendente(); if(!v) return; qrLimpar();
  if(ehEquipe()){ if(G('veiculos',v)) go('veiculo',v,'uso'); return; }
  if(!ehCliente()) return;
  if(!idsVeic().has(v)){ toast('Este veículo não está com a sua empresa agora.'); return; }
  S.p.vid=v; S.p.vtab='resumo'; render();
  const u=usoAberto(v); if(u && (ehGestor()||u.condutorId===S.me.condutorId)) openCheckout(v); else openCheckin(v);
}

  const o={b:0,w:1,i:2}; return A.sort((a,b)=>o[a.sev]-o[b.sev]);
}
function pAlertas(){

    for(const u of LC('usos').filter(u=>u.status==='encerrado_forcado'&&u.fim&&diff(u.fim,h)<=2)) add('i',`Troca de condutor em ${PL(u.veiculoId)}`,`O uso de ${nomeCondutor(u)} foi encerrado por outro check-in em ${dtbr(u.fim)}.`);
    for(const f of LC('faturas').filter(f=>f.status==='aberta')) add(f.vencimento<h?'b':'i',`Fatura ${mesbr(f.competencia)} ${f.vencimento<h?'em atraso':'em aberto'}`,`${money(f.total)} · vence ${dbr(f.vencimento)}`,{act:'ptab',tab:'faturas',lbl:'Ver fatura'});
    for(const m of LC('multas').filter(m=>m.statusIndicacao==='pendente'&&!m.condutorConfirmado)) add('w','Multa aguardando indicação do condutor',`${dtbr(m.dataHora)} · ${PL(m.veiculoId)}${m.prazoIndicacao?' · prazo '+dbr(m.prazoIndicacao):''}`,{act:'ptab',tab:'multas',lbl:'Indicar condutor'});
    for(const d of LC('condutores').filter(d=>d.cnhValidade&&diff(h,d.cnhValidade)<=P.diasAvisoVenc)) add('w',`CNH de ${d.nome} ${d.cnhValidade<h?'vencida':'vence em '+diff(h,d.cnhValidade)+' dias'}`,'Atualize o cadastro do condutor.',{act:'ptab',tab:'condutores',lbl:'Condutores'});
    const pend=LC('condutores').filter(d=>d.status==='pendente').length + (S.perfis||[]).filter(p=>p.cliente_id===S.me.clienteId&&p.perfil==='condutor'&&!p.ativo&&!LC('condutores').some(d=>d.id===p.condutor_id&&d.status==='pendente')).length;
    if(pend) add('w',`${pend} motorista(s) aguardando sua liberação`,'Confira os dados e libere o acesso ao app.',{act:'ptab',tab:'condutores',lbl:'Ver motoristas'});
    const cids=new Set(contratosAtivosCli().map(c=>c.id));
    for(const k of LC('pacotes').filter(k=>cids.has(k.contratoId)&&['aprovado','faturado'].includes(k.status)&&k.aprovadoEm&&diff(k.aprovadoEm,h)<=7)) add('i',`Pacote de ${nf(k.km)} km aprovado`,'O saldo da franquia já foi atualizado.');
    for(const k of LC('pacotes').filter(k=>cids.has(k.contratoId)&&k.status==='recusado'&&diff(locISO(k.atualizadoEm)||h,h)<=7)) add('w',`Pedido de ${nf(k.km)} km recusado`,'Fale com a F2 para entender o motivo.');
  } else { const mc=meuCondutor(); if(mc&&mc.cnhValidade&&diff(h,mc.cnhValidade)<=P.diasAvisoVenc) add('w',`Sua CNH ${mc.cnhValidade<h?'está vencida':'vence em '+diff(h,mc.cnhValidade)+' dias'}`,'Atualize em Meu cadastro.',{act:'ptab',tab:'cadastro',lbl:'Meu cadastro'}); }
  const meus=LC('chamados').filter(c=>gestor||ehMeu(c));
  for(const c of meus){ const hs=c.historico||[]; const ult=hs[hs.length-1]; if(ult && hs.length>1 && diff(locISO(ult.ts),h)<=3) add('i',`Chamado #${c.numero}: ${lbl(CH_ST,c.status)}`,(c.respostaF2||c.descricao||'').slice(0,90),{act:'ptab',tab:gestor?'chamados':'registros',lbl:'Ver chamado'}); }
  for(const r of LC('reembolsos').filter(r=>(gestor||ehMeu(r))&&['aprovado','pago','recusado'].includes(r.status)&&diff(locISO(r.atualizadoEm)||h,h)<=7)) add(r.status==='recusado'?'w':'i',`Reembolso ${lbl(RB_ST,r.status).toLowerCase()}`,`${money(r.valor)} · ${r.motivo||''}`);
  const o={b:0,w:1,i:2}; return A.sort((a,b)=>o[a.sev]-o[b.sev]);
}

/* ===================== backup e importação ===================== */
function baixarArquivo(nome,blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
async function backup(){
  const regs=Object.entries(Store.docs).map(([p,e])=>{ const i=p.indexOf('/'); return {colecao:p.slice(0,i),id:p.slice(i+1),dados:e.d,cliente_id:e.cid}; });
  baixarArquivo(`f2-conect-backup-${hoje()}.json`, new Blob([JSON.stringify({app:'F2 Conect',formato:'supabase-1',exportadoEm:new Date().toISOString(),registros:regs},null,2)],{type:'application/json'}));
  toast('Backup exportado. Os anexos continuam no Storage do Supabase.');
}
async function importar(file){
  let j; try{ j=JSON.parse(await file.text()); }catch(e){ toast('Arquivo inválido.'); return; }
  const regs=[];
  if(Array.isArray(j.registros)) j.registros.forEach(r=>regs.push([r.colecao,r.id,r.dados]));
  else { if(j.config) regs.push(['config','geral',(({id,...x})=>x)(j.config)]); for(const c of COLS.concat(['auditoria'])) (j[c]||[]).forEach(d=>{ const {id,...x}=d; if(id) regs.push([c,id,x]); }); }
  { const r2=[]; for(const [c,id,d] of regs){ if(c==='veiculos'){ const fin={},pub={}; for(const [k,x] of Object.entries(d||{})) (FIN_V(k)?fin:pub)[k]=x; r2.push([c,id,pub]); if(Object.keys(fin).length) r2.push(['veiculos_fin',id,fin]); }
      else if(c==='config' && id==='geral' && (d.planos||[]).length){ r2.push(['config','planos',{lista:d.planos}]); r2.push([c,id,{...d,planos:[]}]); } else r2.push([c,id,d]); } regs.length=0; regs.push(...r2); }
  if(!regs.length){ toast('Nenhum registro encontrado no arquivo.'); return; }
  const ok=await perguntar('Importar backup',`Serão gravados ${regs.length} registros. Os que tiverem o mesmo identificador serão substituídos. Anexos do painel de teste não vêm junto: reenvie os PDFs pelos formulários.`,'Importar');
  if(!ok) return;
  for(const [c,id,d] of regs) if(!Store.docs[c+'/'+id]) Store.docs[c+'/'+id]={d,cid:null};
  Store.ver++;
  const agoraISO=new Date().toISOString();
  const rows=regs.map(([c,id,d])=>({colecao:c,id,dados:d,cliente_id:clienteDe(c,d,id),atualizado_em:agoraISO,atualizado_por:S.uid}));
  for(let i=0;i<rows.length;i+=200){ const {error}=await Supa.sb.from('registros').upsert(rows.slice(i,i+200),{onConflict:'colecao,id'}); if(error){ toast(erroSupa(error)); await carregarTudo(); return; } }
  await carregarTudo(); audit('importou backup','config','geral',regs.length+' registros'); toast(`Backup importado: ${regs.length} registros.`);
}

function credenciais(){ if(CONF.supabaseUrl && CONF.supabaseAnonKey) return {url:CONF.supabaseUrl,key:CONF.supabaseAnonKey,fixo:true}; try{ return JSON.parse(localStorage.getItem('f2_supabase')||'null'); }catch(e){ return null; } }

async function boot(){
  if(!window.supabase || !window.supabase.createClient){ telaShell('<h1>Sem conexão</h1><p class="muted">Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue a página.</p>'); return; }
  const cr=credenciais(); if(!cr){ telaConexao(); return; }
  Supa.sb=window.supabase.createClient(cr.url,cr.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'f2conect-auth'}});
  Supa.sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY') telaNovaSenha(); });
  if(/type=recovery/.test(location.hash)) return;
  let sess=null; try{ sess=(await Supa.sb.auth.getSession()).data.session; }catch(e){}
  if(!PORTA){
    if(qrPendente()){ location.replace('/motorista'); return; }
    if(sess){ try{ const {data:p}=await Supa.sb.from('perfis').select('perfil,ativo').eq('id',sess.user.id).maybeSingle(); const porta=p&&p.ativo&&portaDoPerfil(p.perfil); if(porta){ location.replace('/'+porta); return; } }catch(e){} }
    telaPortas(); return; }
  if(!sess){ telaLogin(); return; }
  await iniciarSessao(sess.user);
}

  <p class="row"><button class="btn ghost sm" id="lg_t">${cad||rec?'Voltar para entrar':'Criar conta'}</button>${cad||rec?'':'<button class="btn ghost sm" id="lg_r">Esqueci minha senha</button>'}${credenciais()&&!credenciais().fixo?'<button class="btn ghost sm" id="lg_c">Trocar projeto</button>':''}</p>`);
  $('#lg_t').onclick=()=>telaLogin(cad||rec?'':'cadastro'); const r=$('#lg_r'); if(r) r.onclick=()=>telaLogin('recuperar');
  const cc=$('#lg_c'); if(cc) cc.onclick=()=>{ try{ localStorage.removeItem('f2_supabase'); }catch(e){} location.reload(); };
  $('#lg').onsubmit=async e=>{ e.preventDefault(); const x=$('#lg_x'); x.hidden=true; $('#lg_b').disabled=true; const email=$('#lg_e').value.trim();
    let res;
    if(rec) res=await Supa.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/'+(PORTA||'')});
    else if(cad) res=await Supa.sb.auth.signUp({email,password:$('#lg_s').value,options:{data:{nome:$('#lg_n').value.trim()},emailRedirectTo:location.origin+'/'+(PORTA||'')}});
    else res=await Supa.sb.auth.signInWithPassword({email,password:$('#lg_s').value});
    $('#lg_b').disabled=false;
    if(res.error){ x.textContent=/Invalid login/i.test(res.error.message)?'E-mail ou senha incorretos.':/Email not confirmed/i.test(res.error.message)?'Confirme seu e-mail pelo link enviado antes de entrar.':res.error.message; x.hidden=false; return; }
    if(rec){ telaShell('<h1>Verifique seu e-mail</h1><p class="muted">Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.</p><button class="btn" id="vb">Voltar</button>'); $('#vb').onclick=()=>telaLogin(); return; }
    if(!res.data.session){ telaShell('<h1>Confirme seu e-mail</h1><p class="muted">Enviamos um link de confirmação. Depois de confirmar, volte e entre com seu e-mail e senha.</p><button class="btn" id="vb">Voltar para entrar</button>'); $('#vb').onclick=()=>telaLogin(); return; }
    iniciarSessao(res.data.session.user); };
}
function telaNovaSenha(){
  telaShell(`<h1>Nova senha</h1><form class="card stack" id="ns"><div class="fld"><label for="ns_s">Nova senha</label><input id="ns_s" type="password" minlength="6" required autocomplete="new-password"></div><p class="hint" id="ns_x" hidden style="color:var(--danger)"></p><button class="btn pri">Salvar senha</button></form>`);
  $('#ns').onsubmit=async e=>{ e.preventDefault(); const {error}=await Supa.sb.auth.updateUser({password:$('#ns_s').value}); if(error){ const x=$('#ns_x'); x.textContent=error.message; x.hidden=false; return; } history.replaceState(null,'',location.pathname); toast('Senha alterada.'); const s=(await Supa.sb.auth.getSession()).data.session; if(s) iniciarSessao(s.user); else telaLogin(); };
}
async function sair(){ try{ await Supa.sb.auth.signOut(); }catch(e){} location.reload(); }
async function carregarTudo(){
  const docs={}; const step=1000;
  for(let from=0;;from+=step){ const {data,error}=await Supa.sb.from('registros').select('colecao,id,dados,cliente_id').order('colecao').order('id').range(from,from+step-1); if(error) throw error; for(const r of data) docs[r.colecao+'/'+r.id]={d:r.dados,cid:r.cliente_id}; if(data.length<step) break; }
  Store.docs=docs; Supa.ultimaCarga=Date.now(); Store.notify();
}
async function carregarPerfis(){ const {data}=await Supa.sb.from('perfis').select('*').order('nome'); S.perfis=data||[]; }
async function iniciarSessao(user){
  let {data:p,error}=await Supa.sb.from('perfis').select('*').eq('id',user.id).maybeSingle();
  if(error){ telaConexao('O banco não respondeu como esperado: '+error.message+'. Rode o script instalacao.sql.'); return; }
  if(p && !p.ativo && p.perfil==='pendente'){ try{ const r=await Supa.sb.rpc('f2_vincular'); if(r.data){ const r2=await Supa.sb.from('perfis').select('*').eq('id',user.id).maybeSingle(); if(r2.data) p=r2.data; } }catch(e){} }
  if(p && !p.ativo && PORTA==='motorista' && qrPendente() && (p.perfil==='pendente' || (p.perfil==='condutor' && !p.cliente_id))){ telaCadastroMotorista(user,p,qrPendente()); return; }
  if(p && p.ativo && p.perfil!=='pendente'){ const porta=portaDoPerfil(p.perfil); if(porta && porta!==PORTA){ telaPortaErrada(user,porta); return; } }
  if(!p || !p.ativo || p.perfil==='pendente'){ const mot=p&&p.perfil==='condutor';
    const txt = mot ? 'O gestor da sua empresa precisa conferir seus dados e liberar o seu acesso.'
      : PORTA==='motorista' ? 'O gestor da sua empresa precisa liberar o seu acesso. Peça para ele cadastrar você com este e-mail, ou leia o QR code colado no carro.'
      : PORTA==='cliente' ? 'A F2 Carloc precisa liberar o seu acesso.' : 'Um administrador da F2 precisa liberar o seu acesso.';
    telaShell(`<h1>${mot?'Cadastro enviado ao gestor':'Acesso aguardando liberação'}</h1><p class="muted">Sua conta (${esc(user.email)}) foi criada. ${txt}</p><div class="row"><button class="btn" id="vn">Verificar de novo</button><button class="btn ghost" id="sx">Sair</button></div>`); $('#vn').onclick=()=>location.reload(); $('#sx').onclick=sair; return; }
  if(['gestor','condutor'].includes(p.perfil) && !p.cliente_id){ telaShell('<h1>Perfil incompleto</h1><p class="muted">Seu usuário ainda não está vinculado a um cliente. Peça à F2 para completar o cadastro.</p><button class="btn" id="sx">Sair</button>'); $('#sx').onclick=sair; return; }
  S.me={id:user.id,email:user.email,nome:p.nome||user.email,perfil:p.perfil,clienteId:p.cliente_id,condutorId:p.condutor_id}; S.uid=user.id;
  telaShell('<h1>Carregando…</h1><p class="muted">Sincronizando os dados.</p>');
  try{ await carregarTudo(); }catch(e){ telaConexao('Erro ao ler os dados: '+(e.message||e)); return; }
  if(ehEquipe()||p.perfil==='gestor') await carregarPerfis();
  Supa.sb.rpc('f2_registrar_acesso').then(()=>{},()=>{});
  S.db=LocalDB; S.assets={upload:(f,cid)=>Anexos.salvar(f,cid)};
  Supa.chan=Supa.sb.channel('f2-registros').on('postgres_changes',{event:'*',schema:'public',table:'registros'},pl=>Store.aplicar(pl))
    .subscribe(st=>{ if(st==='SUBSCRIBED'){ if(Supa.caiu){ Supa.caiu=false; carregarTudo().catch(()=>{}); } setSync('ok'); } else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(st)){ Supa.caiu=true; setSync('off'); } });
  Store.subs.add(agenda);
  const app=document.querySelector('.app'); app.classList.remove('setup'); app.classList.toggle('portal',ehCliente());
  S.route={view:ehCliente()?'p':'painel'}; S.p={tab:'inicio',vid:null,f:{},vtab:'resumo'};
  window.addEventListener('focus',()=>{ if(Date.now()-Supa.ultimaCarga>120000) carregarTudo().catch(()=>{}); });
  render(); tratarQR();
  setInterval(()=>{ if(!document.querySelector('dialog[open]')) render(); }, 60000);
}
boot();
</script>
